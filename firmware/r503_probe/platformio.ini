; R503 bring-up probe — S3-side firmware.
;
; ⛔ build_flags DO NOT REACH ESP-IDF COMPONENT COMPILES for `framework = espidf`.
;    Every compile-time switch in this project lives in
;    src/CMakeLists.txt as target_compile_definitions(${COMPONENT_LIB} PUBLIC ...).
;    Do not add -D here and expect it to arrive. Verify against
;    .pio/build/<env>/compile_commands.json.
;
; Board: ESP32-S3 SuperMini, USB serial number 00:00:5E:00:53:06.
; ⚠ `esp32-s3-devkitc-1` is used as a GENERIC S3 board definition. flash_size is
;   pinned to 4MB (the SuperMini's usual N4/N4R2 part) because over-declaring flash
;   produces a board that boots and then fails obscurely.

[env:supermini_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; ⛔ The upload port is a LEASE, not an identity. Do not hard-code /dev/cu.usbmodemNNNNN
;    here. Resolve it at use time:
;        python3 probe/r503probe.py port
;    and pass it: `pio run -t upload --upload-port "$(python3 probe/r503probe.py port)"`
