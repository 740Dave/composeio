    -std=gnu++17
    -DMQTT_BROKER=\"${sysenv.COMPOSEIO_FW_MQTT_BROKER}\"
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE
    -DBOARD_HAS_PSRAM
    -I${PROJECT_DIR}/../../cyd/src
    ; shared ecosystem broker on 1883 (matches R1/R3 and the Python side)
    -DMQTT_PORT=1883
build_src_filter = +<*> -<host_test_main.cpp> -<boards/> -<hosttest/> -<r503_protocol.cpp> -<real_r503_hal.cpp> -<tm1637/> +<boards/qualia_s3.cpp>
