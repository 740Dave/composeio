; ComposeUX Reactive Embedded Tier — R1: the board-agnostic reactive core
; on the bare ESP32-C3 (headless).  [SPEC:CXC-EMBED-REACTIVE] [CXC-ER-CORE]
;
; Foundation: firmware/esp32_mqtt_client (WiFi + PubSubClient ComposeBus
; client) + the canonical on-chip DSL cyd/src/dsl.{h,cpp} ([SPEC:CXC-DSL]
; Pass 2b) — compiled BY REFERENCE via -I (src/dsl_canonical.cpp), never
; forked.
;
; Secrets hygiene: WIFI_SSID/WIFI_PASS default to YOUR_WIFI_* placeholders
; in main.cpp.  Inject real credentials at flash time, either:
;   PLATFORMIO_BUILD_FLAGS='-DWIFI_SSID=\"ssid\" -DWIFI_PASS=\"pass\"' \
;       pio run -e esp32c3 -t upload
; or drop a src/wifi_config.h (gitignored via the repo-root **/wifi_config.h)
; with the two #defines.  The broker and bus_storage URL are NOT defaults any
; more: every live env bakes them from the host overlay
; (COMPOSEIO_FW_MQTT_BROKER / COMPOSEIO_FW_STORAGE_URL, via ${sysenv.*}) and the
; build FAILS if the env needs one that is unset — these boards have no mDNS, so
; a `.local` placeholder would ship a board that cannot reach its broker/config.

; ------------------------------------------------------------------
; ⛔ FLASH GUARD + LIVE-BUILD ENV (slice 7d).  Every env inherits this hook.
;   * any upload/erase is refused unless the host overlay sets FLASH_DENY_SERIALS
;     (never-flash list; unset/empty = REFUSE) and the explicit --upload-port's USB
;     serial is not on it.  Auto-detect is refused: pass --upload-port.
;   * custom_flash_expect_env = V : the port's USB serial must equal $V (overlay).
;   * custom_fw_required_env = A B : the build FAILS if $A/$B are unset, because the
;     build_flags bake them in via ${sysenv.A} and an unset sysenv is an empty string.
; Public code names no device identity: every identity lives in the host overlay.
; ------------------------------------------------------------------
[env]
extra_scripts = pre:../../python/scripts/pio_flash_guard.py

[platformio]
default_envs = esp32c3

; ------------------------------------------------------------------
; The DUAL-THROTTLE controller on the ESP32-C3 SuperMini (RISC-V), HEADLESS
; + CONFIG-FETCHED ([SPEC:CXC-EMBED-REACTIVE] [CXC-ER-DEVICE] [CXC-ER-BOARDS]
; [CXC-R-BOOT]).  NO baked board profile: the generic firmware fetches its
; dual_throttle.compose.yaml from bus_storage at boot (reusing cyd/src/
; config_fetch + yaml_min BY REFERENCE) and self-configures — ADC pots
; (throttle/left <- GPIO0, throttle/right <- GPIO1) + the DY-SV5F audio cover
; (UART TX GPIO5, BUSY GPIO6).  controller_main.cpp is the shell; main.cpp is
; compiled out under -DCONTROLLER_CONFIG_FETCH.
;
;   pio run -e esp32c3
;   # flash (SuperMini enumerates at usbmodem31101, NOT the pinned 11301):
;   pio run -e esp32c3 -t upload --upload-port /dev/cu.usbmodemXXXXX
;   pio device monitor --port /dev/cu.usbmodemXXXXX
;
; Config asset (PUT the compose.yaml to bus_storage before boot):
;   curl -X PUT --data-binary @dual_throttle.compose.yaml \
;     "$COMPOSEIO_FW_STORAGE_URL/api/v1/assets/displays/dual-throttle.compose.yaml"
; ------------------------------------------------------------------
[env:esp32c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; ⛔ NO upload_port PINNED — DELIBERATELY.  This env used to pin
; /dev/cu.usbmodem11301, which on 2026-08-15 was **the c3lcd board**, a
; DIFFERENT BOARD; the pin would have flashed the wrong device while looking
; entirely correct.  /dev/cu.usbmodem* numbering CHANGES when other devices
; are unplugged, so a pinned path is a cached identity and cached identity is
; a loaded gun.  IDENTIFY THE BOARD PASSIVELY, then pass the port explicitly:
;
;   ioreg -r -c IOUSBHostDevice -l | grep -A40 Espressif   # MAC == USB serial
;   pio run -e esp32c3 -t upload --upload-port /dev/cu.usbmodemXXXXX
;
; ⛔ This env's usual target IS the live dual-throttle controller, whose USB
; serial belongs on FLASH_DENY_SERIALS (host overlay).  The flash guard will
; therefore REFUSE it until an operator deliberately removes it from that list
; for one run.  That is the intended friction, not a defect: there is NO
; override variable (ruling 2026-11-26).
;
; ⛔ `esptool chip-id` is NOT an identity check — it RESETS the board, which
; is the exact harm being avoided.
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMQTT_BROKER=\"${sysenv.COMPOSEIO_FW_MQTT_BROKER}\"
    -DDOCUMENT_STORE_URL=\"${sysenv.COMPOSEIO_FW_DOCUMENT_STORE_URL}\"
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE
    -I${PROJECT_DIR}/../../cyd/src
    ; config_fetch.cpp #include "wifi_config.h" resolves from src/
    -I${PROJECT_DIR}/src
    ; select the config-fetched controller tier (main.cpp compiled out)
    -DCONTROLLER_CONFIG_FETCH
    ; stable config asset id -> displays/dual-throttle.compose.yaml
    -DDISPLAY_DEVICE_ID=\"dual-throttle\"
    ; bus_storage asset store (bus master, per dradis_console device.yaml)
    -DBUS_STORAGE_URL=\"${sysenv.COMPOSEIO_FW_STORAGE_URL}\"
    ; devices ride the shared ecosystem broker on 1883 (Composer/headless
    ; smokes all use it); R1 hardware-verified 2026-07-10 on the C3.
    -DMQTT_PORT=1883
build_src_filter = +<*> -<host_test_main.cpp> -<boards/> -<hosttest/> -<r503_protocol.cpp> -<real_r503_hal.cpp> -<tm1637/>
; the active broker is DERIVED from BUS_STORAGE_URL's host (bus_binding.cpp);
; MQTT_BROKER is only controller_main.cpp's rescue floor, but it is baked from
; the overlay too, so no compiled-in default is ever a placeholder.
custom_fw_required_env = COMPOSEIO_FW_STORAGE_URL COMPOSEIO_FW_DOCUMENT_STORE_URL COMPOSEIO_FW_MQTT_BROKER

; ------------------------------------------------------------------
; OFFICE RELAY-FAN CONTROLLERS — ESP32-WROOM-32E integrated 4-relay boards,
; HEADLESS + CONFIG-FETCHED ([SPEC:CXC-EMBED-REACTIVE] [CXC-ER-DEVICE]
; [CXC-R-BOOT] + [CXC-HAL-ACTUATE] Output Tier 1).  The SAME generic
; controller_main.cpp shell + core as the C3 dual-throttle; only the fetched
; .compose.yaml differs.  The board has NO native USB — flash over an EXTERNAL
; FTDI in MANUAL download mode (IO0->GND, tap EN), no auto-reset:
;
;   pio run -e office_fan -t upload        # port = $OFFICE_RELAY_SERIAL_PORT
;   pio device monitor -e office_fan -b 115200
; The FTDI's port comes from the host overlay (OFFICE_RELAY_SERIAL_PORT); the
; build refuses to upload when it is unset.
;
; Config asset (PUT the compose.yaml to bus_storage BEFORE boot):
;   curl -X PUT --data-binary @office_fan.compose.yaml \
;     "$COMPOSEIO_FW_STORAGE_URL/api/v1/assets/displays/office_fan.compose.yaml"
;
; Two devices, identical boards; the DISPLAY_DEVICE_ID (config id) is the only
; per-unit difference, so each has its own env.  Relay bank + break-before-make
; live entirely in the fetched config; the firmware bakes NO pins.
; NOTE: WROOM-32 uses UART0 for the console (NOT USB-CDC), so the C3/S3
; -DARDUINO_USB_* flags are deliberately ABSENT here.
; ------------------------------------------------------------------
[esp32_relay_base]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
build_unflags = -std=gnu++11
; MANUAL download-mode flashing — the FTDI auto-reset is unreliable on this
; board; hold IO0->GND + tap EN, then upload with no reset toggling.
upload_flags =
    --before=no_reset
    --after=no_reset
build_src_filter = +<*> -<host_test_main.cpp> -<boards/> -<hosttest/> -<r503_protocol.cpp> -<real_r503_hal.cpp> -<tm1637/>

[env:office_fan]
extends = esp32_relay_base
upload_port = ${sysenv.OFFICE_RELAY_SERIAL_PORT}
monitor_port = ${sysenv.OFFICE_RELAY_SERIAL_PORT}
custom_flash_port_env = OFFICE_RELAY_SERIAL_PORT
custom_fw_required_env = COMPOSEIO_FW_STORAGE_URL COMPOSEIO_FW_DOCUMENT_STORE_URL COMPOSEIO_FW_MQTT_BROKER
build_flags =
    -std=gnu++17
    -DMQTT_BROKER=\"${sysenv.COMPOSEIO_FW_MQTT_BROKER}\"
    -DDOCUMENT_STORE_URL=\"${sysenv.COMPOSEIO_FW_DOCUMENT_STORE_URL}\"
    -I${PROJECT_DIR}/../../cyd/src
    -I${PROJECT_DIR}/src
    -DCONTROLLER_CONFIG_FETCH
    -DDISPLAY_DEVICE_ID=\"office_fan\"
    -DBUS_STORAGE_URL=\"${sysenv.COMPOSEIO_FW_STORAGE_URL}\"
    -DMQTT_PORT=1883

[env:office_hepa]
extends = esp32_relay_base
upload_port = ${sysenv.OFFICE_RELAY_SERIAL_PORT}
monitor_port = ${sysenv.OFFICE_RELAY_SERIAL_PORT}
custom_flash_port_env = OFFICE_RELAY_SERIAL_PORT
custom_fw_required_env = COMPOSEIO_FW_STORAGE_URL COMPOSEIO_FW_DOCUMENT_STORE_URL COMPOSEIO_FW_MQTT_BROKER
build_flags =
    -std=gnu++17
    -DMQTT_BROKER=\"${sysenv.COMPOSEIO_FW_MQTT_BROKER}\"
    -DDOCUMENT_STORE_URL=\"${sysenv.COMPOSEIO_FW_DOCUMENT_STORE_URL}\"
    -I${PROJECT_DIR}/../../cyd/src
    -I${PROJECT_DIR}/src
    -DCONTROLLER_CONFIG_FETCH
    -DDISPLAY_DEVICE_ID=\"office_hepa\"
    -DBUS_STORAGE_URL=\"${sysenv.COMPOSEIO_FW_STORAGE_URL}\"
    -DMQTT_PORT=1883

