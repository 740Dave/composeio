; ------------------------------------------------------------------
; R503 FINGERPRINT DEVICE HALF — MOCK SENSOR bring-up on the ESP32-S3
; ([SPEC:CXC-FPHAL] C71/C72/C73).  The SAME pure-C++ mock HAL + device twin
; proven in env:native_test, running on silicon and reporting over SERIAL
; ONLY.  NO baked board profile, NO live bus: the transport is a CONFIG value
; that defaults to "offline" (bus_transport_select.cpp) so this boot brings up
; no WiFi and no MQTT — the live-bus join is a later, deliberate step.
;
; ⛔ IDENTIFY THE BOARD PASSIVELY, then pass the port explicitly.  This S3's
; USB serial number IS its MAC: AA:BB:CC:DD:EE:FF.  NEVER `esptool chip-id`/
; `read_mac` (they RESET the board).  Do NOT touch the two C3s (AA:BB:CC...)
; or the FTDI (FTZ29P6A).
;
;   system_profiler SPUSBDataType | grep -i 'serial number'   # find the node
;   pio run -e fingerprint_s3 -t upload --upload-port /dev/cu.usbmodemXXXXX
;   pio device monitor -e fingerprint_s3 --port /dev/cu.usbmodemXXXXX
; ------------------------------------------------------------------
[env:fingerprint_s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; MQTT/WiFi/JSON for the transport=mqtt online path (bus_transport_select.h
; picks it at RUNTIME, from NVS — these libs are compiled in unconditionally
; so the online branch exists; the default boot path is still offline).
; Same versions as every other live env (esp32c3/qualia_s3/lego_dots).
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
; ⛔ THE PART, DECODED (David, 2026-08-18): ESP32-S3FH4R2 = FH4 (4 MB
; IN-PACKAGE QUAD SPI FLASH) + R2 (2 MB QUAD SPI PSRAM), 400 KB SRAM.  The
; `esp32-s3-devkitc-1` board manifest is the "N8 (8 MB QD, No PSRAM)" profile
; — WRONG on THREE axes at once, not one: flash size, partition table, and
; PSRAM bus width.  Every override below exists to correct exactly one axis;
; do not drop one because another looks like "the fix" — a prior pass (see
; git history) forced flash_mode=dio chasing a QIO-reliability theory and
; RULED IT OUT (looped under qio AND dio), because the real fault was never
; flash_mode: it was `board_build.partitions` being LEFT AT THE BOARD
; MANIFEST'S DEFAULT (`default_8MB.csv`) even though flash_size was
; overridden to 4 MB.  That table's app1/spiffs/coredump partitions sit at
; offsets up to 0x800000 — entirely past this part's physical 0x400000 — so
; the 2nd-stage bootloader's partition-table read/validate faults at a fixed
; early PC, BEFORE any serial print, on every flash_mode tried.  That is the
; self-reset boot loop this defect reports.  Fix: an explicit 4 MB-fitting
; partition table, every time flash_size is overridden — the two travel
; together or neither is real.
;
; ⛔ BOARD CONSTANT — 4 MB FLASH, not the devkitc-1 manifest default 8 MB.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304
; ⛔ BOARD CONSTANT — the manifest's default.arduino.partitions
; (default_8MB.csv) does not fit a 4 MB part; THIS is what actually produced
; the pre-print self-reset loop, independent of flash_mode.  min_spiffs.csv
; is the standard Arduino-ESP32 4 MB / dual-OTA / small-spiffs scheme: app0
; 0x10000..0x1F0000, app1 0x1F0000..0x3D0000, spiffs 0x3D0000..0x3F0000,
; coredump 0x3F0000..0x400000 — ends exactly at 0x400000, the part's actual
; top of flash.
board_build.partitions = min_spiffs.csv
; flash_mode LEFT AT THE MANIFEST DEFAULT (qio) — the part's flash is Quad
; SPI (the "Q" in FH4), and PlatformIO's esp32 builder always normalizes a
; "qio"/"qout" manifest mode to an actual `dio` esptool write
; (builder/main.py:_get_board_flash_mode) regardless of what a board.json
; declares, because the ROM downloader only speaks DIO — every working
; non-octal S3 board (including Adafruit's 4 MB/quad-PSRAM Feather S3,
; confirmed by boards/adafruit_feather_esp32s3_reversetft.json) ships this
; way unmodified.  The earlier forced `board_build.flash_mode = dio` was
; therefore inert (the write was already DIO) and is REMOVED — do not
; re-add it; if a future bootloader fault recurs, it is not this axis.
;
; ⛔ BOARD CONSTANT — PSRAM is QUAD 2 MB (the "R2"), not the manifest's "No
; PSRAM" default and NOT octal.  memory_type "qio_qspi" = quad-SPI flash +
; quad-SPI PSRAM, the exact combination Adafruit ships for its 4 MB/quad-PSRAM
; S3 boards (same reference above).  Declaring it here — rather than leaving
; PSRAM undeclared as the prior env did — makes "does this board have PSRAM,
; and what bus width" a profile fact instead of a silent default.
board_build.arduino.memory_type = qio_qspi
; no upload_port PINNED — resolve it by matching the USB serial (== MAC).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE
    ; matches board_build.arduino.memory_type: the part DOES carry 2 MB quad
    ; PSRAM, even though the fingerprint bring-up allocates nothing large
    ; from it today (mirrors the qualia_s3 env's same declare-what's-true
    ; discipline for its octal part).
    -DBOARD_HAS_PSRAM
    -I${PROJECT_DIR}/../../cyd/src
    -I${PROJECT_DIR}/src
    ; select the fingerprint mock-sensor bring-up (main.cpp compiled out)
    -DFINGERPRINT_BRINGUP
; + the REAL R503 backend: r503_protocol.cpp is PURE (host-tested in
; env:native_test, identical bytes both places — one implementation, never a
; fork), real_r503_hal.cpp carries the ten HAL ops plus the ONE
; silicon-touching class (ArduinoR503Port, behind #ifdef ESP_PLATFORM).
; The mock HAL stays compiled in and stays the default: the real sensor is
; opted into with the `r503 ...` serial commands, so this build still boots
; and joins the bus exactly as before with no sensor attached.
build_src_filter = -<*> +<fingerprint_bringup_main.cpp> +<mock_r503_hal.cpp> +<fingerprint_device_canonical.cpp> +<bus_transport_select.cpp> +<r503_protocol.cpp> +<real_r503_hal.cpp>

; ------------------------------------------------------------------
; Host unit test of the pure core + the R2 actuator HAL (store +
; binding eval + the REAL DSL + binary/PWM/stepper output mapping).
;   pio run -e native_test && .pio/build/native_test/program
; Must print "ALL PASS" and exit 0 — no hardware, no Arduino.
; ------------------------------------------------------------------
[env:native_test]
platform = native
build_flags =
    -std=c++17
    -I${PROJECT_DIR}/../../cyd/src
    ; the CANONICAL widget headers (widgets/*.h, canvas.h, widget.h) for the
    ; RAttr::ChecklistItems / RAttr::NavSelection list-payload parity tests.
    -I${PROJECT_DIR}/../../cyd/include
    ; R5: host-test the transform-tier binding rows (rotation/scale/
    ; sweep) exactly as the qualia_display env compiles them.
    -DREACTIVE_TRANSFORM_ATTRS
    ; controller tier: the config extractor + audio cover are pure C++ and
    ; host-tested against the real dual_throttle.compose.yaml (yaml_min is
    ; pure; config_fetch is NOT — it stays out of the host build).
; src/hosttest/*_canonical.cpp pull the CANONICAL list widgets (checklist,
; master_detail) + their pure substrates (scroll_list, text_wrap) by
; reference so the on-device set_items_json / index_for apply is host-tested
; for parity ([CXC-RM-M5]).  Compiled ONLY here (every device env excludes
; -<hosttest/>), so the headless controller never links widget code.
; + the R503 fingerprint device half (C71/C72/C73): the mock HAL, the device
; twin, and the offline-default transport selection are all PURE C++ and are
; parity-tested here against the Python reference's CXC-FPBUS-SCEN-* scenarios.
build_src_filter = -<*> +<reactive_core.cpp> +<actuator_hal.cpp> +<dsl_canonical.cpp> +<host_test_main.cpp> +<yaml_min_canonical.cpp> +<controller_config.cpp> +<signal_conditioning.cpp> +<audio_cover.cpp> +<relay_actuator.cpp> +<restart_canonical.cpp> +<mock_r503_hal.cpp> +<fingerprint_device_canonical.cpp> +<bus_transport_select.cpp> +<r503_protocol.cpp> +<real_r503_hal.cpp> +<hosttest/>

; ------------------------------------------------------------------
; Host POSITIVE-CONTROL test for the PURE logic the Arduino bus_binding glue
; adds over the host-tested core ([SPEC:CXC-REPOINT]): the mqtt:// host+port
; split (bus_uri.h) AND the two-plane commit gate the confirm wiring drives —
; proving a REAL/echoing broker COMMITS, not only that a bad one reverts.
; The core (cyd/src/bus_binding_core.cpp) is pulled by reference through the
; canonical shim, never forked.
;   pio run -e native_bus_uri && .pio/build/native_bus_uri/program
; Must print "ALL PASS" and exit 0 — no hardware, no Arduino.
; ------------------------------------------------------------------
[env:native_bus_uri]
platform = native
build_flags =
    -std=c++17
    -DBUS_URI_SELFTEST
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../../cyd/src
build_src_filter = -<*> +<bus_binding_canonical.cpp> +<bus_uri_selftest.cpp>
