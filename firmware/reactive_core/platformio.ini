; ------------------------------------------------------------------
; R4 — the reactive core on the Adafruit Qualia ESP32-S3 (Xtensa LX7),
; HEADLESS ([SPEC:CXC-EMBED-REACTIVE] [CXC-ER-BOARDS]).  The THIRD ESP32
; variant: the SAME board-agnostic core (reactive_core.cpp by reference)
; + the SAME app shell (main.cpp) as R1; only boards/qualia_s3.cpp is
; new.  The Qualia's RGB666 panel is R5 and is not used here.
;
; Board: a generic esp32-s3-devkitc-1 is right for headless (the panel
; is out of scope); the Qualia has native USB (usbmodem console, same
; CDC-on-boot flags as the C3) + octal PSRAM.  PSRAM is enabled because
; the board has it, but the headless core allocates nothing large, so it
; is not load-bearing for R4.
;   pio run -e qualia_s3 -t upload && pio device monitor -e qualia_s3
; ------------------------------------------------------------------
[env:qualia_s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem31101
monitor_port = /dev/cu.usbmodem31101
; octal PSRAM present on the Qualia S3 (not required by the headless core)
board_build.arduino.memory_type = qio_opi
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE
    -DBOARD_HAS_PSRAM
    -I${PROJECT_DIR}/../../cyd/src
    ; shared ecosystem broker on 1883 (matches R1/R3 and the Python side)
    -DMQTT_PORT=1883
build_src_filter = +<*> -<host_test_main.cpp> -<boards/> -<hosttest/> -<r503_protocol.cpp> -<real_r503_hal.cpp> +<boards/qualia_s3.cpp>

