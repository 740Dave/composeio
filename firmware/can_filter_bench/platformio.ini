; can_filter_bench — ESP32-C3 TWAI acceptance-filter capability bench
;
; ONE BINARY, BOTH BOARDS. There is deliberately no "transmitter build" and no
; "receiver build". Role is chosen at RUNTIME over the serial REPL (`ROLE TX` /
; `ROLE RX`, or just by which commands you send). This is the platform's
; device-fungibility principle applied to a test rig: two identical devices, one
; artefact, behaviour from configuration. It also removes the single most common
; bench error — flashing the wrong build to the wrong board and then trusting the
; result.
;
; DEFAULT ENV = c3_usbcdc.
;   Use this for any ESP32-C3 board whose USB-C connector goes STRAIGHT to the
;   chip's GPIO18/GPIO19 (the built-in USB Serial/JTAG peripheral). That is the
;   ESP32-C3 SuperMini and most USB-C C3 boards. On macOS the port appears as
;   /dev/cu.usbmodem*.
;
; FALLBACK ENV = c3_uart.
;   Use this ONLY if your board has a separate USB-to-UART bridge chip (CP2102N,
;   CH340, ...) — e.g. the ESP32-C3-DevKitM-1. On macOS those appear as
;   /dev/cu.usbserial-* , /dev/cu.SLAB_USBtoUART or /dev/cu.wchusbserial*.
;   Building the wrong env gives you a board that flashes but prints nothing.
;
; See docs/research/CAN-ACCEPTANCE-FILTER-RESEARCH.md for the full bench setup.

;
; ⛔ FLASH GUARD (slice 7d): every upload/erase from this project passes through
;    python/scripts/pio_flash_guard.py — refused unless the host overlay sets
;    FLASH_DENY_SERIALS (never-flash list; unset/empty = REFUSE) and the explicit
;    upload port's USB serial is not on it.  Auto-detect is refused.
[env]
extra_scripts = pre:../../python/scripts/pio_flash_guard.py

[platformio]
default_envs = c3_usbcdc

[common]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The C3's built-in USB Serial/JTAG has no real UART baud rate, and esptool's
; mid-session renegotiation to the board default (460800) intermittently fails
; with "A fatal error occurred: No serial data received." Pinning the upload
; speed skips the renegotiation entirely. Observed and fixed on this bench.
upload_speed = 115200
; Same root cause: on this bench, esptool's RAM stub loader intermittently drops
; the USB-JTAG link right after "Stub running...", giving
;   A fatal error occurred: Unable to verify flash chip connection
;     (No serial data received.)
; --no-stub uses the ROM loader instead. Slower, completely reliable here.
; Observed and fixed on this bench 2026-08-10; both flags are load-bearing.
upload_flags = --no-stub
; Line-oriented REPL: send LF (or CRLF). `pio device monitor` sends what you type
; plus the terminal's newline, which is what we want.
monitor_filters = send_on_enter, colorize
monitor_echo = yes
build_flags =
    ; ---- TWAI pin assignment -------------------------------------------------
    ; Justified in docs/research/CAN-ACCEPTANCE-FILTER-RESEARCH.md §2.3.
    ; ESP32-C3 Datasheet v2.4 §2.3.4 classifies GPIOs by priority. Only FOUR
    ; GPIOs on the C3 are "Priority 2 — can be freely used without restrictions":
    ; GPIO0, GPIO1, GPIO3, GPIO10. Everything else is a strapping pin (2/8/9),
    ; the USB Serial/JTAG (18/19), the JTAG interface (4/5/6/7), UART0 (20/21),
    ; VDD_SPI (11) or in-package flash (12..17).
    ; GPIO0/GPIO1 double as XTAL_32K_P/N, so we keep GPIO1 for the (optional) E2
    ; trigger and take the two pins that carry no alternate crystal role.
    -D TWAI_TX_GPIO=3
    -D TWAI_RX_GPIO=10
    -D TRIG_GPIO=1
    -D FW_VERSION=\"1.0.0\"

[env:c3_usbcdc]
extends = common
build_flags =
    ${common.build_flags}
    ; `Serial` -> the chip's native USB Serial/JTAG CDC on GPIO18/19.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:c3_uart]
extends = common
build_flags =
    ${common.build_flags}
    ; `Serial` -> UART0 on GPIO20/21, for boards with a USB-serial bridge chip.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
