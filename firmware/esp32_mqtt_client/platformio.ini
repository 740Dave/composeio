[env:esp32c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE
    -D MQTT_BROKER=\"mqtt-broker.local\"
    -D MQTT_PORT=1884
    -D WIFI_SSID=\"YOUR_WIFI_SSID\"
    -D WIFI_PASS=\"YOUR_WIFI_PASSWORD\"
    -D I2C_SDA=8
    -D I2C_SCL=9
    -D CIO_TOPIC_PREFIX=\"composeio\"
