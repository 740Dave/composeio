; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE
	-I${PROJECT_DIR}/../../cyd/src

[env:esp32-c3-reflib]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps = robtillaart/TM1637_RT@^0.5.0
build_flags = 
	-std=gnu++17
	-DARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_MODE
	-DREFLIB_CONTROL
build_src_filter = -<*> +<main_reflib.cpp>

; ==========================================================================
; CLASSIC-LIBRARY CONTROL env — added 2026-08-24.  David trusts the classic
; Arduino TM1637 library (header <TM1637.h>): SeeedStudio "Grove 4-Digit
; Display" (Frankie Chu, MIT), the canonical/most-popular lib with that exact
; header (registry popularity 1525, Compatible Platforms: *, resolves +
; compiles for esp32-c3 arduino — verified).  Its segment table matches OUR
; driver's default map, so a CLEAN count here is the model our fix follows.
; RobTillaart lit but rendered garbage (its own encoding); this is the
; trusted reference instead.
;
; Compiles ONLY src/main_tm1637h.cpp and defines TM1637H_CONTROL (the guard
; that file lives inside).  Same pins CLK=GPIO4 / DIO=GPIO3, module 3.3V.
;
;   pio run -e esp32-c3-tm1637h -t upload --upload-port /dev/cu.usbmodemXXXXX
;   pio device monitor -e esp32-c3-tm1637h --port /dev/cu.usbmodemXXXXX
; ==========================================================================
[env:esp32-c3-tm1637h]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps =
    ; classic Arduino TM1637 lib, header <TM1637.h>, class TM1637.
    seeed-studio/Grove 4-Digit Display@^2.0.0
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE
    -DTM1637H_CONTROL
build_src_filter = -<*> +<main_tm1637h.cpp>
