; CH32V203C8T6 (nanoCH32V203, MuseLab/wuxx) bring-up
; Toolchain: Community-PIO-CH32V platform-ch32v + Arduino core (openwch)
; Flash via wchisp (chip enters USB ISP bootloader on BOOT0+reset).

; ------------------------------------------------------------------
; Bring-up blink (verified running on the real chip).
; ------------------------------------------------------------------
[env:nanoCH32V203]
platform = ch32v
board = genericCH32V203C8T6
framework = arduino

; Build a plain .bin next to the .elf so wchisp can flash it.
board_build.f_cpu = 144000000L

; Only the blink main (the tree now also holds dsl_ch32_main.cpp).
build_src_filter = -<*> +<main.cpp>

; We flash manually with wchisp (chip is already in ISP mode).
; `pio run -t upload` would also work via tool-wchisp, but manual is explicit.

; ------------------------------------------------------------------
; [SPEC:CXC-EMBED-REACTIVE] — the QingKe V4B corpus re-verify: the SAME
; 234-case [SPEC:CXC-DSL] conformance run on the CH32V203C8T6.  Proves the
; ComposeUX expression-DSL is soft-`double` bit-exact on a THIRD RISC-V
; core (after the ESP32-C3 RISC-V and the Xtensa LX6/LX7 cores).
;
; The DSL + harness + corpus are compiled BY REFERENCE from cyd/src +
; cyd/test (byte-identical with cyd's env:esp32c3_dsl_test / dsl_test
; envs — never forked); see dsl_reuse.py.  This env adds only a thin
; USB-CDC main (src/dsl_ch32_main.cpp).
;
;   cd firmware/ch32v203_bringup
;   pio run -e ch32v203_dsl_test
;   # then (owner in ISP mode): wchisp flash .pio/build/ch32v203_dsl_test/firmware.bin
;   # console: pio device monitor -e ch32v203_dsl_test  (native USB CDC)
; ------------------------------------------------------------------
[env:ch32v203_dsl_test]
platform = ch32v
board = genericCH32V203C8T6
framework = arduino
board_build.f_cpu = 144000000L

; ---- FLASH SIZE (READ THIS) ------------------------------------------
; The 234-case corpus (~20 KB .rodata) + libgcc soft-double + newlib strtod
; + TinyUSB CDC does NOT fit the C8T6's DATASHEET 64 KB — it is ~18 KB over
; even after trimming (see the build report).  The corpus + harness are
; reused UNMODIFIED (shared with the ESP envs + render tier) so they cannot
; be shrunk here.  The CH32V203C8T6 die physically carries more flash than
; its 64 KB marking (the well-known CH32V203 "extra flash"); wchisp writes
; and the core runs from it.  We target 128 KB so the image links and runs.
; RISK: this relies on per-unit extended flash beyond the 64 KB spec — the
; owner must confirm their unit is stable above 64 KB (it usually is). A
; guaranteed-fit alternative is a larger-flash CH32V203 (e.g. RB = 128 KB
; official) with the SAME env.
board_upload.maximum_size = 131072

; Native USB CDC (openwch TinyUSB): makes `Serial` the USB CDC device, so
; printf (retargeted in dsl_ch32_main.cpp) prints over USB — same posture
; as the C3/S3 native-USB console.
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_USBD
    ; compile the shared harness body (guards dsl_selftest.cpp) — same flag
    ; the ESP dsl_test envs pass.
    -D DSL_CORPUS_TEST
    ; TinyUSB: CDC-only. The ch32 port's default tusb_config also enables
    ; MSC/HID/MIDI/VENDOR (all #ifndef-guarded) — we use none of them; drop
    ; them to fit 64 KB flash. (VIDEO is already disabled by the core.)
    -D CFG_TUD_MSC=0
    -D CFG_TUD_HID=0
    -D CFG_TUD_MIDI=0
    -D CFG_TUD_VENDOR=0
    ; dsl.h (cyd/src) + generated corpus (cyd/test); also set in dsl_reuse.py.
    -I ${PROJECT_DIR}/../../cyd/src
    -I ${PROJECT_DIR}/../../cyd/test
    ; The recursive-descent parser needs more than the 2 KB default stack;
    ; the (shallow) corpus needs only a few KB, 8 KB is generous headroom
    ; (RAM is 20 KB; the 234-case tables live in flash .rodata, not RAM).
    -Wl,--defsym=__STACK_SIZE=0x2000
    ; ---- flash-size squeeze (64 KB is tight: corpus+soft-double+USB) ----
    ; No exception unwind tables (we build -fno-exceptions anyway).
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    ; Merge identical constants/strings. SAFE here: the DSL compares strings
    ; by VALUE (strcmp / std::string ==), never by pointer identity, and the
    ; corpus has many repeated tokens ("on"/"off"/group names).
    -fmerge-all-constants

; Skip libraries this env never uses (keeps their code out of the image).
lib_ignore =
    SPI
    Wire

; Optimisation stays at the core default -Os (NO -ffast-math / -Ofast) so
; `double` keeps IEEE-754 soft-float semantics — the bit-exactness proof.

; Build only the DSL-test main from src/ (exclude the blink main.cpp); the
; shared cyd/src DSL + harness come in via the PRE-script below.
build_src_filter = -<*> +<dsl_ch32_main.cpp>
extra_scripts = pre:dsl_reuse.py
