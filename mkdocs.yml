site_name: SMD Specification Corpus
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.tooltips
    - toc.integrate

plugins:
  - search
  - mkdocs-smd:
      graph_json: true
      traceability: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

