version: "3.8"

services:
  document-store:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: document-store
    ports:
      - "8421:8421"
    volumes:
      - docstore-data:/app/data
    environment:
      - COMPOSEIO_DOCSTORE_DB=/app/data/docstore.db
      - COMPOSEIO_DOCSTORE_PORT=8421
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8421/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  docstore-data:
