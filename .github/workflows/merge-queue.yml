# merge-queue: the only route to main once the ruleset requires its status. The shape is FactLattice's (a `queue` label on a
# pull_request_target event, the suite re-run on the PR head, a commit status `merge-queue/tested` that the ruleset requires),
# with ONE change: the private-term scan runs here, on a self-hosted runner on the maintainer's machine, because that runner
# is where the private vocabulary lives. It never goes into a GitHub secret, a hosted runner or a log.
#
# DELIBERATE DIFFERENCES FROM FACTLATTICE'S QUEUE (not a port of its driver):
#   1. No sweep driver. One run tests one PR. The merge itself is GitHub's: the ruleset requires `merge-queue/tested` and
#      "branches up to date", so the head tested here IS the tree that lands, and auto-merge (or a person) merges it.
#      A PR that is behind main is refused here with "update the branch", never tested against a stale base.
#   2. The leakcheck job runs on [self-hosted, macOS, composeio-private-vocab] and RUNS NO PR CODE: it checks out main (this
#      file's own branch, so the guard that judges a PR is main's copy, never the PR's), fetches the PR head as git objects
#      from the public remote without a token, and reads it as data (tools/leakcheck.py diff). The runner provides the
#      vocabulary directory in its environment as COMPOSEIO_LEAKCHECK_PRIVATE; when it is unset or empty the guard refuses,
#      so the job is red, never green over no rules.
#   3. PR code runs only in the `suite` job, on a hosted runner, with a read-only token that is not persisted.
#      The suite does not run gitleaks: the PR's own copy of a check never decides the result. MAIN's copies of gitleaks
#      and of the disclosure guard run in the leakcheck job (tools/queue_leakcheck.py), and `merge-queue/tested` is
#      success only if they pass, the suite passes, and the PR title and body re-read just before posting are the
#      text the leakcheck job scanned last.
#
# RUNNER PRECONDITIONS (docs/leakcheck/RUNNER.md): the runner is registered only after tools/runner_preconditions.py passes
# (interaction limit collaborators_only, fork-PR workflow approval for all outside contributors). Reading those settings
# needs admin read, which neither the runner's account nor GITHUB_TOKEN has, and no admin token is stored anywhere. So the
# maintainer's Mac runs the live check on a schedule and records a dated result in the Actions variable
# RUNNER_PRECONDITIONS; the job reads it through `vars` (no token) and refuses when it is missing, stale or not a pass.
# The job also refuses unless github.workflow_ref is the default branch's merge-queue.yml. A collaborator's own PR can
# still name the runner in its own workflow: the same known limit FactLattice accepted.
#
# KNOWN LIMITS. A same-repository PR's own workflow can post a status named `merge-queue/tested` (FactLattice's limit too);
# pinning the required status to the GitHub Actions app in the ruleset narrows it. The PR that introduces this file cannot be
# queued through it (main has no leak tools yet): it lands by hand, and the ruleset is applied after it.
name: merge-queue

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to test
        required: true

permissions: {}

concurrency:
  group: merge-queue-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'queue'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - id: pr
        name: read the PR (open, into the default branch, not from a fork)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" > pr.json
          python3 - <<'PY'
          import json, os, sys
          pr = json.load(open("pr.json"))
          bad = []
          if pr["state"] != "open": bad.append("not open")
          if pr["base"]["ref"] != os.environ["DEFAULT"]: bad.append("base is not the default branch")
          if (pr["head"]["repo"] or {}).get("full_name") != os.environ["REPO"]: bad.append("head is on a fork")
          if bad:
              print("merge-queue: refused:", "; ".join(bad)); sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"number={pr['number']}\nhead={pr['head']['sha']}\nbase={pr['base']['sha']}\n")
          PY

  suite:
    name: suite
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
      - name: negative control (synthetic vocabulary)
        run: python3 -I tests/leakcheck/negative_control.py --synthetic
      - name: composebus installs alone and its tests pass
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./python/composebus pytest
          cd python/composebus && "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider tests

  leakcheck:
    name: leakcheck
    needs: plan
    runs-on: [self-hosted, macOS, composeio-private-vocab]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: refuse unless this is the default branch's merge-queue.yml (a misrouted run fails loudly; see docs/leakcheck/RUNNER.md)
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED: ${{ github.repository }}/.github/workflows/merge-queue.yml@refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$WORKFLOW_REF" != "$EXPECTED" ]; then echo "leakcheck: REFUSED: workflow_ref is $WORKFLOW_REF, expected $EXPECTED"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: fetch the PR head as objects (no token; it is never run)
        env:
          NUMBER: ${{ needs.plan.outputs.number }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags --quiet "https://github.com/$REPO.git" "+refs/pull/$NUMBER/head:refs/leakcheck/head"
          test "$(git rev-parse refs/leakcheck/head)" = "$HEAD_SHA" || { echo "merge-queue: the PR head moved since planning; re-queue"; exit 1; }
      - id: scan
        name: main's copies of every check (preconditions first, then term scan, gitleaks, negative control; tools/queue_leakcheck.py)
        env:
          NUMBER: ${{ needs.plan.outputs.number }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          REPO: ${{ github.repository }}
          RUNNER_PRECONDITIONS: ${{ vars.RUNNER_PRECONDITIONS }}
        run: python3 -I tools/queue_leakcheck.py --head "$HEAD_SHA" --pr "$NUMBER" --repo "$REPO" --output "$GITHUB_OUTPUT"
    outputs:
      pr_text_sha256: ${{ steps.scan.outputs.pr_text_sha256 }}

  tested:
    name: tested
    needs: [plan, suite, leakcheck]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: text
        name: re-read the PR title and body now; they must be the text the leakcheck job scanned last
        env:
          NUMBER: ${{ needs.plan.outputs.number }}
          REPO: ${{ github.repository }}
          SCANNED: ${{ needs.leakcheck.outputs.pr_text_sha256 }}
        # Three answers, never two: `true` the text re-read now is the text scanned last; `false` it changed (or could
        # not be re-read); `not-scanned` the leakcheck job stopped before its scan finished, so there is nothing to
        # compare and no claim about the text is made. (Run 45816157425 printed "changed" for a PR nobody edited,
        # because a refused leakcheck job writes no digest.)
        run: |
          if [ -z "$SCANNED" ]; then
            echo "merge-queue: no PR text digest from the leakcheck job: it stopped before scanning (see its log)"; echo "same=not-scanned" >> "$GITHUB_OUTPUT"; exit 0; fi
          now="$(python3 -I tools/queue_leakcheck.py --print-digest --pr "$NUMBER" --repo "$REPO")" || now=unreadable
          if [ "$now" = "$SCANNED" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else
            echo "merge-queue: the PR title or body changed after the scan (or could not be read: $now): re-queue"; echo "same=false" >> "$GITHUB_OUTPUT"; fi
      - name: post merge-queue/tested on the tested head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          SUITE: ${{ needs.suite.result }}
          LEAK: ${{ needs.leakcheck.result }}
          TEXT_SAME: ${{ steps.text.outputs.same }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SUITE" = success ] && [ "$LEAK" = success ] && [ "$TEXT_SAME" = true ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$state" -f context=merge-queue/tested \
            -f description="suite: $SUITE; leakcheck (main's checks): $LEAK; PR text unchanged: $TEXT_SAME" -f target_url="$RUN_URL"
          test "$state" = success
