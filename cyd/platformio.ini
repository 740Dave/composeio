; ------------------------------------------------------------------
; [SPEC:CXC-BRINGUP] [SPEC:CXC-BOARD-HW] — the ESP32-C3 Super Mini CAN
; FIRST-LIGHT node: the fleet's first MCU to put frames ON a CAN segment
; rather than only take them off one.
;
; Headless by design.  No glass, no scene, no config fetch, no radio: it
; publishes a 1 Hz heartbeat and a 5 s twai_get_status_info() report
; upward, and logs `throttle/left` on the way down.  That status report
; is the whole point — bus_can.cpp never reads the controller's error
; state and answers connected() with `s_started`, so a BUS-OFF ESP32
; reports CONNECTED forever and ESP-IDF's TWAI driver does not recover on
; its own.  This env builds the missing instrument; it does not change
; the policy (see can_bringup_main.cpp for why those are two changes).
;
; BENCH WIRING (2026-08-12): SN65HVD230 on GPIO5 = CTX, GPIO4 = CRX, onto
; the rpi5 Waveshare 2-CH CAN HAT's can0 at 500 kbit/s, sample point
; 0.875.  Terminators: the C3 breakout's soldered 120R and can0's jumper;
; can1 is jumpered to the same segment with ITS terminator OFF and is the
; INDEPENDENT WITNESS — never the same interface the bridge is using.
;
; Pins are compile DEFAULTS in src/CMakeLists.txt's CXC_CAN_BRINGUP
; branch, overridden at runtime from NVS (can.tx/can.rx/can.bitrate).
;
; Namespaces this node speaks are CAN-ONLY, so the bridge can never learn
; their names by observing MQTT: every one must be in CAN_BRIDGE_REGISTER
; (deploy/can_mqtt_bridge/composeio-can-bridge.env) or the bridge drops
; them, correctly and loudly, as unresolvable hashes.
;
;   pio run -e esp32_c3_can_bringup -t upload && pio device monitor -e esp32_c3_can_bringup
; ------------------------------------------------------------------
[env:esp32_c3_can_bringup]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
; PINNED BY PORT, VERIFIED BY MAC.  A port path is not an identity —
; /dev/cu.usbmodem11301 belonged to a different board an hour before this
; env was written, and iterating over ports reset a live controller that
; had been explicitly ring-fenced (2026-08-12).  The flash guard ENFORCES
; identity: the port's USB serial must equal C3LCD_EXPECT_SERIAL (host overlay)
; and must not be on FLASH_DENY_SERIALS.  Unset = refuse.  Passive look:
;   ioreg -r -c IOUSBHostDevice -l -w0
; `esptool chip-id` is NOT an identity check: it resets the board, which is
; the harm being prevented.  Both C3s on this bench share the 1C:DB:D4
; prefix — the guard matches the FULL serial.
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
custom_flash_expect_env = C3LCD_EXPECT_SERIAL
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: build_flags never reach an ESP-IDF component compile for
; framework=espidf, and CXC_CAN_BRINGUP is a CMake CACHE VAR that never
; reaches the compiler either.  CXC_CAN_BRINGUP_APP, CXC_DEVICE_PREFIX
; and the CAN pin defaults are target_compile_definitions in the
; CXC_CAN_BRINGUP branch of src/CMakeLists.txt.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; primary console on the C3's native USB-Serial-JTAG (the usbmodem port)
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"
    -DCXC_CAN_BRINGUP=1

; ------------------------------------------------------------------
; BENCH-ONLY.  Identical to [env:esp32_c3_can_bringup] except that it
; also carries the PIN DRIVE TEST: CAN CTX (GPIO5) and a control pad
; (GPIO7) each driven as a 0.33 Hz square wave — 1.5 s high, 1.5 s low,
; five cycles — which a DC MULTIMETER can follow trivially.
;
; It exists because a meter on CTX during a transmit retry reads a steady
; 1.603 V, half of the 3.25 V rail, and that is EITHER a 50% duty square
; wave the meter is averaging (the pin drives, silicon fine) OR a pad
; sitting at mid-rail because nothing drives it.  A DC meter cannot
; separate those, and the whole transmit investigation rests on assuming
; the first.  At 1.5 s per level the ambiguity disappears.
;
; A SEPARATE ENV rather than a flag on the normal one, deliberately:
; somebody is standing at the bench with a probe, and "which firmware is
; actually on it" must not be a question.  Flash back to
; esp32_c3_can_bringup when done.
;
; ⚠ If the transceiver works this holds the bus DOMINANT for 1.5 s at a
; time and the Pi will log bus errors — that is a PASS, not damage.
;
;   pio run -e esp32_c3_pin_drive_test -t upload && pio device monitor -e esp32_c3_pin_drive_test
; ------------------------------------------------------------------
[env:esp32_c3_pin_drive_test]
extends = env:esp32_c3_can_bringup
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"
    -DCXC_CAN_BRINGUP=1
    -DCXC_PIN_DRIVE=1

