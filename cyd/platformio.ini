; PlatformIO configuration for ComposeUX Embedded Display
; Target: CYD (ESP32-2432S024) — ILI9341 240x320, XPT2046 touch
; Framework: ESP-IDF (no Arduino)

; ------------------------------------------------------------------
; GLOBAL, EVERY ENV — the build stamp ([SPEC:CXC-BOARD-HW], workstream 0.4).
;
; `pre:` runs BEFORE anything is built and regenerates src/gen/build_stamp.h
; with this env's name and the wall clock, plus an append-only
; fingerprint -> string map in cyd/build_fingerprints.json.  The firmware
; announces the 32-bit fingerprint on `_device/<id>/build`; `composeio fleet`
; resolves it back to "hosyond_s3 Aug 13 2026 21:41:02".
;
; A `[env]` SECTION, not a build_flag and not per-env.  Two reasons:
;   - build_flags never reach an ESP-IDF component compile for
;     framework=espidf (this file already records three defects from that),
;     and neither do CMake cache vars — but an extra_script writes a real
;     HEADER, which every compiler reads;
;   - the env NAME is part of the stamp, and an extra_script gets it free
;     from $PIOENV.  Threading it in any other way would mean editing 23 envs
;     and remembering to edit the 24th.
;
; It runs for the native envs too.  Harmless: their build_src_filter excludes
; build_stamp.cpp, so the header is written and never read.
; ------------------------------------------------------------------
; ⛔ FLASH GUARD runs FIRST: every upload/erase is refused unless the
;    host overlay sets FLASH_DENY_SERIALS (never-flash list; unset/empty = REFUSE)
;    and the explicit upload port's USB serial is not on it.  Auto-detect is
;    refused.  custom_flash_expect_env = V (per env) pins one board: $V.
[env]
extra_scripts =
    pre:../python/scripts/pio_flash_guard.py
    pre:tools/gen_build_stamp.py

[env:cyd]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbserial-3120
monitor_port = /dev/cu.usbserial-3120

; ESP-IDF uses CMake — source lives in main/
; PlatformIO auto-detects main/ as the component directory

build_flags =
    -I${PROJECT_DIR}/include

board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

; WiFi memory optimization — CYD has no PSRAM
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.defaults

; ------------------------------------------------------------------
; [SPEC:CXC-DSL] Pass 2b — expression-DSL conformance runners
; ------------------------------------------------------------------

; On-device corpus runner: same board, but DSL_CORPUS_TEST swaps the
; app for the 226-case conformance run (src/dsl_selftest.cpp).
;   pio run -e cyd_dsl_test -t upload && pio device monitor
[env:cyd_dsl_test]
extends = env:cyd
build_flags =
    -I${PROJECT_DIR}/include
    -DDSL_CORPUS_TEST

; [SPEC:CXC-EMBED-REACTIVE] R1 — the RISC-V corpus re-verify: the SAME
; 234-case conformance run on the bare ESP32-C3 (2b proved Xtensa only;
; this proves the soft-double bit-exactness on the second architecture).
; src/CMakeLists.txt builds ONLY dsl.cpp + dsl_selftest.cpp for this
; target (the CYD display sources are Xtensa-board-specific).
;   pio run -e esp32c3_dsl_test -t upload && pio device monitor -e esp32c3_dsl_test
[env:esp32c3_dsl_test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
build_flags =
    -I${PROJECT_DIR}/include
    -DDSL_CORPUS_TEST
board_build.partitions = partitions.csv
board_build.flash_mode = dio
; primary console on the C3's native USB-Serial-JTAG (the usbmodem port)
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"

; [SPEC:CXC-EMBED-REACTIVE] R4 — the S3 LX7 corpus re-verify: the SAME
; 234-case conformance run on the Adafruit Qualia's ESP32-S3.  2b proved
; Xtensa LX6 (classic ESP32), R1 proved RISC-V (C3); this proves the
; soft-double bit-exactness on the THIRD architecture — Xtensa LX7.
; The corpus + harness are reused VERBATIM (dsl_selftest.cpp +
; test/dsl_corpus_generated.h); src/CMakeLists.txt already builds ONLY
; dsl.cpp + dsl_selftest.cpp for any non-esp32 IDF_TARGET (esp32s3 hits
; that branch, exactly like the C3's esp32c3).
;   pio run -e qualia_s3_dsl_test -t upload && pio device monitor -e qualia_s3_dsl_test
[env:qualia_s3_dsl_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem31101
monitor_port = /dev/cu.usbmodem31101
build_flags =
    -I${PROJECT_DIR}/include
    -DDSL_CORPUS_TEST
board_build.partitions = partitions.csv
board_build.flash_mode = dio
; primary console on the S3's native USB-Serial-JTAG (the usbmodem port)
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.s3.defaults"

; ------------------------------------------------------------------
; [SPEC:CXC-EMBED-REACTIVE] R5 — the Qualia RGB666 REACTIVE DISPLAY:
; the full reactive/scene/widget stack (R3) on the Adafruit Qualia
; ESP32-S3 with the 4.0" 720x720 ROUND NV3052C panel (Adafruit 5793,
; David-confirmed).  Display tier swapped vs the CYD: LCD_CAM RGB
; peripheral scanning a PSRAM framebuffer (canvas_qualia) + NV3052C
; init over the PCA9554 expander (boards/qualia_rgb666) + LIVE
; TRANSFORMS ([CXC-ER-C6]) + the framebuffer pull capture server.
; ALL panel constants live in include/qualia_panel.h (one retune
; point).  Source selection is CMake (QUALIA_DISPLAY cache var).
;   pio run -e qualia_display -t upload && pio device monitor -e qualia_display
; (native-USB CDC — a transient re-enumeration may need one upload
;  retry, same as R4.)
; ------------------------------------------------------------------
[env:qualia_display]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem31101
monitor_port = /dev/cu.usbmodem31101
build_flags =
    -I${PROJECT_DIR}/include
    ; C++ source guards (qualia_main, canvas include switch, device id)
    -DQUALIA_DISPLAY
    ; rotation/scale/sweep binding rows (transform-capable tier only)
    -DREACTIVE_TRANSFORM_ATTRS
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.s3.defaults;${PROJECT_DIR}/sdkconfig.qualia.defaults"
    -DQUALIA_DISPLAY=1

; ------------------------------------------------------------------
; [CXC-BRINGUP] — the Hosyond ESP32-S3 2.8" IPS board (ES3C28P):
; ILI9341V 240x320 over SPI + FT6336G capacitive touch, 16 MB flash,
; 8 MB octal PSRAM, native USB (NO USB-serial bridge).
;
; The CYD's app stack unchanged, with the board seam swapped
; (boards/hosyond_s3.cpp + touch_ft6336.cpp — see src/CMakeLists.txt)
; and ONE difference above the seam: CXC_BAND_HEIGHT=320 renders the
; frame in a single full-height band instead of the CYD's 20 passes,
; because this board has PSRAM to hold a whole frame.  That is the
; BACKEND widening to meet the contract, not a board-specific widget.
;   pio run -e hosyond_s3 -t upload && pio device monitor -e hosyond_s3
; (native-USB CDC — a transient re-enumeration may need one upload
;  retry, same as the other S3 envs.)
; ------------------------------------------------------------------
[env:hosyond_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem31101
monitor_port = /dev/cu.usbmodem31101
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: the full-frame band height (CXC_BAND_HEIGHT=320) is NOT set here.
; For framework=espidf, PlatformIO build_flags never reach the IDF
; component compile — a -D here is silently dropped.  It is a
; target_compile_definitions in src/CMakeLists.txt's HOSYOND_S3 branch.
board_build.partitions = partitions.16mb.csv
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.s3.defaults;${PROJECT_DIR}/sdkconfig.hosyond.defaults"
    -DHOSYOND_S3=1

; ------------------------------------------------------------------
; [CXC-BRINGUP] — the Waveshare ESP32-C6-LCD-1.47: ST7789T 172x320 IPS
; over SPI, NO touch, 4 MB flash, NO PSRAM, single-core RISC-V.
;
; The first RISC-V board in this tree that actually drives GLASS
; (env:esp32c3_dsl_test is a DSL-conformance build with no display).
; Band tier like the classic CYD — the default 16-scanline kBandHeight,
; 172*16*2 = 5,504 B band buffer in internal SRAM.
;
; NOTE the 172-wide panel: scenes written for the 240-wide CYD/Hosyond
; will overflow horizontally.  PanelGeometry carries the real width;
; author scenes to it.
;   pio run -e waveshare_c6 -t upload && pio device monitor -e waveshare_c6
; ------------------------------------------------------------------
[env:waveshare_c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: build_flags never reach ESP-IDF component compiles for
; framework=espidf — the board's compile definitions are
; target_compile_definitions in src/CMakeLists.txt's WAVESHARE_C6 branch.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c6.defaults"
    -DWAVESHARE_C6=1

; ------------------------------------------------------------------
; [SPEC:CXC-BRINGUP] [SPEC:CXC-BOARD-HW] — the ESP32-C3 Super Mini +
; LCDWIKI MSP3525/MSP3526 3.5" ST7796S 480x320 IPS panel, driven by
; throttle values arriving over CAN.
;
; The WIDEST panel in the fleet on the SMALLEST RAM budget.  480*320*2 =
; 307,200 B is a full frame and this part has ~400 KB of SRAM shared with
; IDF, FreeRTOS, WiFi and TWAI — so it is a BAND-tier board and there is
; deliberately no CXC_BAND_HEIGHT anywhere: 480*16*2 = 15,360 B, 20 bands
; per frame, band buffer in internal DMA-capable SRAM.
;
; NO FPU (RV32IMAC).  Every float in the band canvas is software-emulated,
; so scene AUTHORING decides the frame rate: measured on the C6, same
; binary, only the scene changed — dial gauges 892.9 ms/frame vs led_bar
; rectangles 31.2 ms.  The engine-thrust scene for this board is built out
; of led_bar / rect / label for exactly that reason.
;
; NO TOUCH, and not because the module lacks it: an FT6336U is fitted and
; there are no pins left.  Full occupancy is in include/esp32c3_st7796_panel.h.
;
; DISPLAY PINS (owner-confirmed against the module's J2 silkscreen
; 2026-08-12): SCLK=GPIO4, MOSI=GPIO7, CS=GPIO10, DC/RS=GPIO3, RST=GPIO1,
; BL=GPIO0.  VCC is fed 5V on purpose (onboard XC6206; the manual states
; that feeding 3.3V loses its dropout and dims the backlight), logic is
; 3.3V through a 74LVC245PW.  SPI mode 0, MSB first, 10 MHz (80/8) against
; a datasheet ceiling of 15.15 MHz (TSCYCW 66 ns).
;
; CAN: CTX=GPIO5, CRX=GPIO6, 500 kbit/s, and ⚠ LISTEN-ONLY — a workaround
; for a transceiver whose driver is dead, set in the CXC_C3_ST7796 branch
; of src/CMakeLists.txt and announced at ERROR level on every boot.  Delete
; CXC_CAN_LISTEN_ONLY once the replacement transceivers are soldered.
;
; SCENE DELIVERY IS HTTP, NOT CAN.  config-over-CAN is blocked by two
; defects found 2026-08-12 (the terminating ACK is 13 bytes and classic CAN
; refuses >8; BusMessage.to_json() cannot serialise a config chunk's
; bytes), and compiling a scene in would make this the first firmware in
; the tree carrying composition — the property [CXC-R-BOOT-FUNGIBLE]
; exists to protect.  So the radio comes up for `config: http` and the
; scene is PUT to bus_storage as displays/c3lcd-<last3 of C3LCD_EXPECT_SERIAL>.compose.yaml, while
; the throttle values ride CAN.  That also keeps GET /capture.bmp alive.
;
;   pio run -e esp32_c3_st7796 -t upload && pio device monitor -e esp32_c3_st7796
; ------------------------------------------------------------------
[env:esp32_c3_st7796]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
; PINNED BY PORT, VERIFIED BY MAC — a port path is not an identity.
; /dev/cu.usbmodem11301 has changed device FOUR times on this bench, and
; iterating over ports once reset a live controller that had been
; explicitly ring-fenced.  The flash guard ENFORCES identity: the port's USB
; serial must equal C3LCD_EXPECT_SERIAL (host overlay — the c3lcd/c3can board)
; and must not be on FLASH_DENY_SERIALS (the live dual-throttle controller is
; there).  Unset = refuse.  To look for yourself, passively:
;   ioreg -r -c IOUSBHostDevice -l -w0
; Both C3s here share the 1C:DB:D4 prefix — the guard matches the FULL
; serial.  `esptool chip-id` is NOT an identity check: it resets the board,
; which is the harm being prevented.
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
custom_flash_expect_env = C3LCD_EXPECT_SERIAL
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: build_flags never reach an ESP-IDF component compile for
; framework=espidf, and CXC_C3_ST7796 is a CMake CACHE VAR that never
; reaches the compiler either.  CXC_DEVICE_PREFIX, CXC_BUS_TRANSPORT_DEFAULT,
; CXC_CAN_LISTEN_ONLY, the CAN pin defaults and CXC_COLOR_BASELINE are all
; target_compile_definitions in the CXC_C3_ST7796 branch of src/CMakeLists.txt.
;
; ITS OWN PARTITION TABLE, and not for the app size: NVS goes 24 KB -> 64 KB.
; config_cache_store() writes the WHOLE scene into NVS on every fetch, and an
; 8 KB scene fills a 24 KB log-structured partition that also holds WiFi
; calibration.  A full NVS then starves every OTHER key — measured here after a
; complete NVS erase, a FOUR-BYTE transport selection still failed to store —
; which silently welds shut the `_device/<id>/transport` control plane that
; exists so this board can be taken out of listen-only WITHOUT a reflash.  The
; shared partitions.csv is left alone because widening it moves the NVS of four
; boards that are not on the bench.  See partitions_c3_st7796.csv.
board_build.partitions = partitions_c3_st7796.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"
    -DCXC_C3_ST7796=1

; ------------------------------------------------------------------
; [SPEC:CXC-CONFIG-BUS] [CXC-CONFIG-BUS-RELAY] — the headless RELAY:
; CAN (TWAI + SN65HVD230 transceiver) upstream, UART downstream.  No
; display, no scene, no config of its own; it forwards config chunks
; CHUNK BY CHUNK and reassembles NOTHING, because only the endpoint
; reassembles and a CH32V203 has ~20 KB of RAM.
;
; ESP32 rather than the CH32V203 on purpose: that part is a different
; toolchain end to end (wchisp, no ESP-IDF) and a bring-up in its own
; right, and two new things at once produce a failure nobody can
; attribute.  The relay logic names only send/sink function pointers, so
; the port later is a driver swap, not a redesign.
;
; Pins are compile DEFAULTS in src/CMakeLists.txt's CXC_RELAY branch and
; are overridden at runtime from NVS (can.tx/can.rx/can.bitrate,
; uart.tx/uart.rx) — a rig is re-pointed by command, not by rebuild.
;   pio run -e esp32_can_relay
; ------------------------------------------------------------------
[env:esp32_can_relay]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: build_flags never reach an ESP-IDF component compile for
; framework=espidf, and CXC_RELAY is a CMake CACHE VAR that never reaches
; the compiler either.  CXC_RELAY_APP and the pin defaults are
; target_compile_definitions in the CXC_RELAY branch of src/CMakeLists.txt.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.s3.defaults"
    -DCXC_RELAY=1

; ------------------------------------------------------------------
; [SPEC:CXC-BRINGUP] [SPEC:CXC-BOARD-HW] [CXC-VISION-SEMANTIC-REALIZATION]
; — rack_triple_gauge: David's FIRST CUSTOM PCB, and the fleet's FIRST
; NON-RASTER REALIZATION BACKEND.
;
; Three automotive x27.168 stepper needles + three 12 V LED backlights.
; ESP32-C3 Super Mini socketed on 2x 1x8 headers; MCP23017 @0x20 fans 12
; coil lines into 3x L293D; the backlights are NOT on the expander — they
; are ESP32 GPIO0/1/3 into 3x 2N2222, so hardware PWM via LEDC is available.
;
; ⛔ THE BOARD IS NOT FABBED.  Everything here is a BUILD-AHEAD.  Nothing in
; this env has run on silicon and no number in it is a measurement.
;
; ⚠ THE STRAPPING CHECK, done FIRST and reported here because it is the
; highest-value fact in the whole exercise: GPIO0/GPIO1/GPIO3 are NOT
; strapping pins on the ESP32-C3.  The C3's boot straps are GPIO2, GPIO8 and
; GPIO9 ONLY (datasheet §2.4; corroborated by [SPEC:CXC-BOARD-HW]
; `strapping-and-uart-caveats`, owner-confirmed on this module 2026-08-12).
; GPIO0 is the boot strap on the CLASSIC ESP32 and on the S3 — NOT here.
; The three 2N2222 backlight nets are BOOT-SAFE.  What the check DID find is
; that J_EXP_ESP breaks out GPIO2 (pin 1) and GPIO9 (pin 4) unlabelled; see
; the descriptor's `exp-header-exposes-two-straps`.
;
; PINS (from generate_pcb.py NETS + the emitted .kicad_pcb pad assignments):
;   SDA = GPIO4  (J_ESP_L pin 5)      SCL = GPIO5 (J_ESP_R pin 8)
;   LED1 = GPIO0, LED2 = GPIO1, LED3 = GPIO3   (2N2222, 150R base)
;   free + non-strapping on the headers: GPIO6, GPIO7, GPIO10
;   ⚠ GPIO20/21 are UART0 — the ROM bootloader prints there at 115200 on
;     every reset regardless of the app console.  A FREE INSTRUMENT for
;     proving TX/ground/baud before any firmware of ours is a suspect.
;
; TRANSPORT: direct WiFi/MQTT — ruled.  DP-CIO-6: this part has a radio.
; CONFIG:    HTTP from bus_storage — ruled (the Qualia's path).
;
;   pio run -e rack_triple_gauge
;   pio run -e rack_triple_gauge -t upload && pio device monitor -e rack_triple_gauge
;
; ⚠ IDENTITY BEFORE FLASHING.  A port path is not an identity; usbmodem
; numbering has changed device FIVE times on this bench and iterating over
; ports once reset a ring-fenced live controller.  Confirm the USB serial
; (the MAC, on a native-USB C3) with
;   ioreg -r -c IOUSBHostDevice -l -w0
; `esptool chip-id` is NOT an identity check — it resets the board, which is
; the harm being prevented.  The flash guard refuses any serial on
; FLASH_DENY_SERIALS (host overlay: the LIVE dual-throttle controller).  Unset =
; refuse.  The c3lcd/c3can board (C3LCD_EXPECT_SERIAL) is not this target
; either: once this board exists, pin it with custom_flash_expect_env.
; upload_port is deliberately UNSET here — there is no board yet, and a
; guessed port is a loaded gun.
; ------------------------------------------------------------------
[env:rack_triple_gauge]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: build_flags never reach an ESP-IDF component compile for
; framework=espidf, and CXC_RACK_TRIPLE_GAUGE is a CMake CACHE VAR that
; never reaches the compiler either.  CXC_RACK_TRIPLE_GAUGE_APP,
; CXC_DEVICE_PREFIX and CXC_BUS_TRANSPORT_DEFAULT are all
; target_compile_definitions in the CXC_RACK_TRIPLE_GAUGE branch of
; src/CMakeLists.txt.  Verify in
; .pio/build/rack_triple_gauge/compile_commands.json.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; primary console on the C3's native USB-Serial-JTAG (the usbmodem port)
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"
    -DCXC_RACK_TRIPLE_GAUGE=1

; ------------------------------------------------------------------
; BENCH-ONLY.  Identical to [env:rack_triple_gauge] except that it also runs
; the FULL-SCALE SWEEP TEST once, immediately after homing: every needle to
; full scale, back to zero, then re-home.
;
; It is its OWN env rather than a flag on the normal one for the same reason
; env:esp32_c3_pin_drive_test is: somebody will be standing at the bench
; watching three needles, and there must be no doubt about which binary is
; on the board.
;
; WHY IT EXISTS AT ALL.  It is the only instrument on this board that CAN
; FAIL.  ready() is true, every I2C write returns ESP_OK, every step counts
; perfectly — and all of that is equally true of a needle that never moved
; and of one losing steps at the slew rate.  A needle that does not reach
; the printed full-scale mark, or does not come back to zero, is the
; measurement; nothing in software can substitute for it.
;   pio run -e rack_triple_gauge_sweep -t upload
; ------------------------------------------------------------------
[env:rack_triple_gauge_sweep]
extends = env:rack_triple_gauge
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"
    -DCXC_RACK_TRIPLE_GAUGE=1
    -DCXC_G3_SWEEP=1

; ------------------------------------------------------------------
; [SPEC:CXC-BRINGUP] [CXC-VISION-EPISTEMICS] — THE ON-TARGET DIAGNOSTIC.
; ⛔ FLASH THIS FIRST.  Before [env:rack_triple_gauge], every time, on every
; new board.
;
; It answers ONE question — WHAT CAN THE MCU REACH? — and it drives NO
; needle to a position and does NOT home.  Homing slams a needle against a
; mechanical stop for 5.4 s; against wrong wiring that is a mechanical
; event, not a diagnostic.
;
; ⛔ IT IS NOT A SUBSTITUTE FOR THE MULTIMETER PASS, AND THE MULTIMETER PASS
; IS NOT A SUBSTITUTE FOR IT.  They answer different questions and neither
; can answer the other's.  A METER answers "what is this board?" with the
; power OFF — shorts, continuity, orientation, rails.  FIRMWARE answers
; "what can the MCU reach?" with the power ON.  A SHORT IS A MULTIMETER
; QUESTION; A MARGINAL LOGIC LEVEL IS A FIRMWARE QUESTION, and this board
; has a known one (§4.1: the MCP23017 sits on +5 V with 3.3 V pull-ups, 200
; mV under its guaranteed V_IH).  Do docs/board-bringup/
; rack_triple_gauge-PREFLIGHT.md first — on 2026-08-12 three rounds of
; protocol diagnostics ran against a transceiver that had no supply.
;
; ⛔ THIS IS NOT [env:native_gauge].  That one runs on the HOST and proves
; the homing STATE MACHINE and the binding ARITHMETIC — it would pass
; identically if the board were never fabbed, which is exactly what it did.
; This one runs on the C3 and proves REACHABILITY.  Disjoint jobs.
;
; SEVEN RUNGS, each printing PASS/FAIL with the MEASURED VALUE, each stating
; what it exercised and what it did NOT, three carrying a deliberate FAULT
; INJECTOR so their zeros mean something:
;   1 identity + build stamp + reset reason (brownout = a rail FAIL)
;   2 I2C substrate: idle levels, 9-clock recovery, external pull-up
;     presence, full 0x03..0x77 scan.  >8 responders is reported as a SHORT,
;     not as a rich bus
;   3 I2C INTEGRITY STRESS — 10,000 register round trips at 400 kHz and
;     2,000 at 100 kHz, reporting an ERROR RATE and its resolution floor.
;     THIS IS THE RUNG FOR THE V_IH DEFECT: a scan proves one ACK at 3.3 V,
;     it says nothing about the ten-thousandth write on a warm afternoon
;   4 per-pin drive and read-back on all 16 expander pads, reading GPIO
;     (the pad) and never OLAT (the latch, which is a mirror)
;   5 L293D reachability — twelve coil lines, one at a time
;   6 backlight channels, named individually, one at a time
;   7 rail sanity — reports NO MEASUREMENT, honestly, and says why
;
; ⚠ UNPLUG J_EXP_MCP before running: rung 4 briefly drives GPB4-7.
;
;   pio run -e rack_triple_gauge_selftest -t upload && \
;     pio device monitor -e rack_triple_gauge_selftest
; ------------------------------------------------------------------
[env:rack_triple_gauge_selftest]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/include
; NOTE: build_flags never reach an ESP-IDF component compile for
; framework=espidf, and CXC_G3_DIAG is a CMake CACHE VAR that never reaches
; the compiler either.  CXC_G3_DIAG_APP is a target_compile_definitions in
; the CXC_G3_DIAG branch of src/CMakeLists.txt.  Verify in
; .pio/build/rack_triple_gauge_selftest/compile_commands.json.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.c3.defaults"
    -DCXC_G3_DIAG=1

