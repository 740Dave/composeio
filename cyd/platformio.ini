; ------------------------------------------------------------------
; [SPEC:CXC-EMBED-REACTIVE] DP-CIO-6 — the per-namespace COALESCING MAILBOX
; that replaced the 16-deep inbound FIFO on BOTH the MQTT and UART receive
; paths (bus_mailbox.h).  Host-tested because the coalescing logic — not the
; FreeRTOS plumbing — is where the correctness lives:
;   (a) two updates to one ns coalesce to the LATEST;
;   (b) N distinct namespaces past the old FIFO depth all survive one burst
;       (the retained-flood-on-reconnect case that motivated the change);
;   (c) the drop counter moves ONLY on genuine structure-full, at the boundary;
;   (d) a writer thread and a reader thread under the transport's mutex
;       discipline never produce a torn slot.
; It does NOT run FreeRTOS; the on-target priority-inheriting mutex is a
; code-review fact (mailbox_post / poll in bus_mqtt.cpp and bus_uart.cpp).
;   pio run -e native_mailbox && .pio/build/native_mailbox/program
; Must print "ALL PASS" and exit 0.
; ------------------------------------------------------------------
[env:native_mailbox]
platform = native
build_src_filter = -<*> +<bus_mailbox_selftest.cpp>
build_flags =
    -std=c++17
    -pthread
    -DMAILBOX_CORPUS_TEST
    -I${PROJECT_DIR}/src

; ------------------------------------------------------------------
; [SPEC:CXC-DEVICE-BASELINE] cap 1 — the asset-change-notify CONSUMER, host
; unit test.  Proves the header-based self-select rule (the device never
; computes sha256) and the {old,new} change-event parser, WITH NEGATIVE
; CONTROLS ([CXC-VISION-EPISTEMICS]): every "reload" is paired with a
; "must-NOT-reload" case and the reboot seam is a call-counting spy.
