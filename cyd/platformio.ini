; ------------------------------------------------------------------
; [SPEC:CXC-FRESHNESS] [CXC-FRESH-CPP-FOLLOWON] — the C++ LEAF FRESHNESS
; RECEIVER, host-tested with an INJECTED CLOCK.
;
; ⛔ WHY THE CLOCK IS INJECTED RATHER THAN SLEPT.  The decisive negative
; control is "STILL FRESH AT 2.999 s".  A test built on a real sleep cannot
; make that claim honestly — the sleep's own jitter is the same order as the
; margin.  Every timestamp in the harness is a literal, so both halves of
; every rule ("it expires at 3x" AND "it does NOT expire at 2.999x") are
; assertable.
;
; ⛔ AND WHY THERE IS A MUTATION HARNESS.  A freshness receiver CAN ONLY
; REPORT SUCCESS: one that never marks anything stale passes every test that
; asks "did it go unknown?", and so does the INVERSE defect — one that
; condemns everything, including the quiet-by-design namespaces whose silence
; IS the design.  So the six load-bearing rules are each breakable by
; -DFRESHNESS_MUTANT=N and the suite is run against every mutant to prove it
; can go RED.  Nothing in this file defines FRESHNESS_MUTANT.
;   pio run -e native_freshness && .pio/build/native_freshness/program
;   tools/freshness_mutants.sh          # the six negative controls
; Must print "ALL PASS" and exit 0.
; ------------------------------------------------------------------
[env:native_freshness]
platform = native
build_src_filter = -<*> +<freshness.cpp> +<freshness_yaml.cpp> +<yaml_min.cpp>
                   +<bus_frame.cpp> +<freshness_selftest.cpp>
build_flags =
    -std=c++17
    -DFRESHNESS_CORPUS_TEST
    -I${PROJECT_DIR}/src

