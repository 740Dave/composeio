# Synthetic data generator for test dashboard
duration: 30s

namespaces:
  - name: engine_rpm
    state_engine: continuous_0_255
    publish_rate: 10hz
    pattern:
      type: sine
      min: 0
      max: 255
      period: 5s

  - name: ftl_arm
    state_engine: binary
    publish_rate: 0.5hz
    pattern:
      type: toggle

  - name: shields
    state_engine: tri_level
    publish_rate: 0.3hz
    pattern:
      type: cycle

  - name: alert_status
    state_engine: stop_light
    publish_rate: 0.2hz
    pattern:
      type: cycle
