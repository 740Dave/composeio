[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composebus"
version = "0.1.2"
description = "ComposeBus kernel — the bare, transport-agnostic ComposeIO bus"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Exactly one runtime dependency ([CXC-CBK-PKG-DISTRIBUTION]): the plugin
# contract (composebus.plugin) is built on pydantic models, and a bare
# ComposeIOBus() installs the default plugins.
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["composebus", "composebus.plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
