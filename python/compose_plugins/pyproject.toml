[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-plugins"
version = "0.2.0"
description = "The shared plug-in contract library (manifest, consent, version rule) for ComposeIO and Gnomon hosts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Exactly one runtime dependency ([CXC-PC-LIBRARY]): composebus, for
# ComposePlugin and its MessageType names. No ComposeIO distribution, no pluggy
# ([CXC-PC-RULE-BUS-OPTIONAL], [CXC-PC-NO-PLUGGY]). Test tools are NOT declared
# as an extra, so the wheel's Requires-Dist stays exactly composebus; they live
# in tests/requirements.txt.
dependencies = ["composebus==0.1.2"]

[project.scripts]
compose-plugin = "compose_plugins.derive:main"

[tool.setuptools]
packages = [
    "compose_plugins", "compose_plugins.schema", "compose_plugins.fixtures",
    "compose_plugins.fixtures.hello_world_v1", "compose_plugins.fixtures.hello_world_v1.hello_world",
    "compose_plugins.fixtures.hello_world_v2", "compose_plugins.fixtures.hello_world_v2.hello_world",
    "compose_plugins.fixtures.hello_world_eula", "compose_plugins.fixtures.hello_world_eula.hello_world",
]

[tool.setuptools.package-data]
"compose_plugins.schema" = ["*.json"]
"compose_plugins.fixtures.hello_world_v1" = ["manifest.json"]
"compose_plugins.fixtures.hello_world_v2" = ["manifest.json"]
"compose_plugins.fixtures.hello_world_eula" = ["manifest.json", "EULA.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
