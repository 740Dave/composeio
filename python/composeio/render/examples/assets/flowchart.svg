<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260" font-family="sans-serif">
  <!-- A Mermaid/Graphviz-shaped flowchart: the diagram service emits SVG
       like this ([CXC-SVG-C5]); the SvgWidget is its universal consumer. -->
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5b8c"/>
      <stop offset="1" stop-color="#28405f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="260" fill="#12151c"/>

  <!-- edges -->
  <g stroke="#8fa6c4" stroke-width="2" fill="none">
    <line x1="160" y1="46" x2="160" y2="78"/>
    <line x1="160" y1="124" x2="160" y2="156"/>
    <path d="M110 180 L60 180 L60 210"/>
    <path d="M210 180 L260 180 L260 210"/>
  </g>
  <g fill="#8fa6c4">
    <polygon points="160,80 155,70 165,70"/>
    <polygon points="160,158 155,148 165,148"/>
  </g>

  <!-- Start (rounded) -->
  <rect x="110" y="14" width="100" height="32" rx="16" fill="url(#node)" stroke="#9fb6d4" stroke-width="1.5"/>
  <text x="160" y="34" font-size="13" text-anchor="middle" fill="#eaf1fb">Start</text>

  <!-- Decision (diamond) -->
  <polygon points="160,78 214,101 160,124 106,101" fill="url(#node)" stroke="#9fb6d4" stroke-width="1.5"/>
  <text x="160" y="105" font-size="12" text-anchor="middle" fill="#eaf1fb">ready?</text>

  <!-- Process -->
  <rect x="110" y="156" width="100" height="34" fill="url(#node)" stroke="#9fb6d4" stroke-width="1.5"/>
  <text x="160" y="177" font-size="12" text-anchor="middle" fill="#eaf1fb">dispatch</text>

  <!-- Two terminals -->
  <ellipse cx="60" cy="228" rx="46" ry="20" fill="#2f5d3a" stroke="#7fc99a" stroke-width="1.5"/>
  <text x="60" y="232" font-size="12" text-anchor="middle" fill="#e6f6ec">done</text>

  <ellipse cx="260" cy="228" rx="46" ry="20" fill="#5d2f38" stroke="#c98f9a" stroke-width="1.5"/>
  <text x="260" y="232" font-size="12" text-anchor="middle" fill="#f6e6ea">retry</text>
</svg>
