app:
  id: m31-annotated-viewer
  transports: []
design: {title: M31 Annotated Viewer, target: desktop, width: 584, height: 444, theme: dark}
namespaces:
- {name: astro/annotations, state_engine: json}
- {name: viewer/click, state_engine: json}
- {name: viewer/tour, state_engine: binary}
widgets:
- type: pixel_stack
  id: composite
  width: 560
  height: 420
  background: '#0B0D12'
  border: '#3A3A50'
  corner_radius: 4
  clip: true
  children:
  - {type: image, id: image_m31, src: 'bus://assets/m31/board.png', fit: contain,
    publish_namespace: viewer/click, x: 20, y: 16, w: 520, h: 330}
  - type: callout
    id: callout_core
    text: M31 · core
    target: [0.47, 0.5]
    offset: [40, -30]
    x: 20
    y: 16
    w: 520
    h: 330
    namespace: astro/annotations
  - type: callout
    id: callout_m110
    text: M110
    target: [0.26, 0.7]
    offset: [-40, 26]
    color: '#FFA726'
    x: 20
    y: 16
    w: 520
    h: 330
  - {type: button, id: btn_start, label: Start Tour, publish_namespace: viewer/tour,
    x: 404, y: 368, w: 140, h: 36}
