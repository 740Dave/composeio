# R503 fingerprint-game — per-device DIAGNOSTIC view ("R503 internals" panel).
#
# FUNCTIONAL PLACEHOLDER. Distinct from fingerprint_fleet.compose.yaml (the
# roster-wide fleet/device-status table) and fingerprint_monitor.compose.yaml
# (the runtime auth-event "cylon detector") — this is the DEEPER,
# single-device sibling of the fleet view: one device's live FPBUS event
# timeline (heartbeats, template-set load/failure, auth attempts),
# most-recent-first, for a troubleshooter watching ONE board.
#
# Composes the ONE new `fingerprint_device_diagnostic` panel — nothing else
# is forked.
#
# Run headless:  python -m composeio.render.examples.fingerprint.drive_device_diagnostic

app:
  id: fp-device-diagnostic
  transports: []                 # in-process bus; the device publishes on it directly

# [CXC-PROJECT-WIDGETS] import the module that self-registers
# `fingerprint_device_diagnostic` BEFORE any type: is resolved — zero engine
# edits.
widget_modules:
  - composeio.render.widgets.fingerprint_device_diagnostic

design:
  target: desktop
  title: "R503 — Device Diagnostic (dev/s3-fp1, placeholder)"
  theme: dark
  width: 1060
  height: 560

widgets:
  - type: label
    id: title
    text: "DEVICE DIAGNOSTIC — R503 internals"
    font_size: 18
    font_weight: bold
    color: [0x8A, 0xD4, 0xFF]
    align: left
    height: 28

  - type: label
    id: subtitle
    text: "live bus event timeline for one device — most recent first"
    font_size: 12
    color: [0xFF, 0xC1, 0x66]
    align: left
    height: 18

  - type: stack
    id: body
    direction: column
    gap: 14
    align: start
    padding: 4

    children:
      - {type: fingerprint_device_diagnostic, id: v_diag, title: "R503 INTERNALS",
         device_id: "dev/s3-fp1", max_rows: 30,
         width: 1020, height: 460}
