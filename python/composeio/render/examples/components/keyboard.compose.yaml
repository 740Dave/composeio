    id: demo_column
    direction: column
    gap: 12
    children:
      - type: label
        text: "target_ns (demo/message) mirrors the last key pressed:"
        font_size: 12
        color: "#808c9b"
      - type: text_input
        id: readout
        namespace: demo/message
        placeholder: "type on the keyboard"
      - { use: keyboard, target_ns: demo/message }

