# ComposeUX Widget Primitive — keyboard ([SPEC:CXC-PRIM] [CXC-PRIM-CATALOG])
#
# A forkable COMPONENT: a QWERTY grid of rect+label "key" pairs (same
# lightweight-key construction as numpad.compose.yaml — the code
# ButtonWidget's LED gutter + 100px minimum body cannot make a compact
# 34x36 key).  Each letter publishes its literal lowercase char to
# target_ns; keycaps DISPLAY uppercase (the same convention a physical
# keyboard uses — the typed char stays lowercase).
#
# SAME SCOPING DECISION as numpad.compose.yaml (read it first): a key
# publish REPLACES target_ns (last-key-wins), not append/accumulate —
# the DSL has no string concatenation and there is no RMW publish site
# outside headless ``outputs:`` ticks. shift_mode publishes a companion
# `{target_ns}_shift` binary toggle for a consumer/workload to honor
# (KNOWN LIMITATION: letter keys do not themselves case-shift, since
# publish_value is a static per-key literal, not a runtime expression).
# backspace publishes a literal sentinel char (KNOWN LIMITATION: not a
# real delete-last — see numpad's note on accumulation).
#
# Run:
#   cd python/composeio/render/examples/components
#   python3 -m composeio.render.engine.runtime keyboard.compose.yaml

app:
  id: demo-keyboard

design:
  title: "keyboard"
  width: 460
  height: 280
  theme: dark

namespaces:
  - name: demo/message
    state_engine: json

components:
  keyboard:
    params: [layout, target_ns, shift_mode, keycaps]
    defaults:
      layout: qwerty          # only qwerty ships in v1 (COMP-5: no loops/
                               # conditionals -> a second layout is a fork,
                               # not a param-driven variant)
      shift_mode: true
      keycaps: uppercase
    widget:
