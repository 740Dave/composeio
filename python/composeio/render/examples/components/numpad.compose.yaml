          id: key_1_bg
          x: 0
          y: 0
          w: 44
          h: 36
          corner_radius: 4
          fill_color: "#161c24"
          stroke_color: "#283340"
          stroke_width: 1
          publish_namespace: "{{target_ns}}"
          publish_value: "1"
        - type: label
          id: key_1_lbl
