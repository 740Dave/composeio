# ComposeUX Widget Primitive — numpad ([SPEC:CXC-PRIM] [CXC-PRIM-CATALOG])
#
# A forkable COMPONENT: a 3-wide grid of rect+label "key" pairs (a
# lightweight cell, NOT the code ButtonWidget — ButtonWidget reserves a
# 28px LED gutter + a 100px minimum body, which cannot make a compact
# 44x36 numeric key; see SUMMARY for the full reasoning).  Each key
# publishes its literal char to target_ns via the existing
# publish_namespace/publish_value mechanism — zero new interaction code.
#
# SCOPING DECISION (flagged for ratification): a key publish is
# last-key-wins (REPLACES target_ns), not append/accumulate. The DSL has
# no string-concatenation operator ([SPEC:CXC-DSL] is numeric/logic
# only) and there is no read-modify-write publish site outside headless
# ``outputs:`` ticks, so true character accumulation cannot be expressed
# as a pure declarative composite in the current engine. Per
# [CXC-BIND-BOUNDARY] ("compute in a bus workload instead"), a companion
# bus workload/Intelligence is the intended accumulator: subscribe to
# target_ns's per-key publishes and maintain the real string namespace a
# text_input then renders. This composite is the UI/publish surface, not
# the accumulator.
#
# Run:
#   cd python/composeio/render/examples/components
#   python3 -m composeio.render.engine.runtime numpad.compose.yaml

app:
  id: demo-numpad

design:
  title: "numpad"
  width: 420
  height: 260
  theme: dark

namespaces:
  - name: demo/keypress
    state_engine: json

components:
  numpad:
    params: [target_ns, allow_decimal, on_enter]
    defaults:
      allow_decimal: false
      on_enter: null          # optional-and-prunable (COMP-5): omitted ->
                               # the ENTER key's publish_namespace: key is
                               # pruned entirely, so it safely no-ops
    widget:
