        font_size: 12
        color: "#808c9b"
      - type: text_input
        id: readout
        namespace: demo/keypress
        placeholder: "tap a key"
      - { use: numpad, target_ns: demo/keypress, allow_decimal: true, on_enter: demo/keypress_enter }

