# Part catalog entry — a small passive SPEAKER (the DY-SV5F's audio terminus).
#
# A minimal 2-terminal passive part (like pot-10k is a 3-terminal passive part):
# it is the acoustic OUTPUT the DY-SV5F drives directly from its Spk+/Spk- pins
# (the module has an onboard class-D amp, so a bare 4-8 ohm speaker connects with
# no extra amplifier).  Added so the DY-SV5F's speaker wires have an honest
# netlist TERMINUS in the hookup guide.
#
# No `fritzing:` art is cached for the speaker, so S3's compositing pass renders it
# via the schematic-style pin-labeled body fallback (same path esp32-c3 uses) — a
# labeled 2-pin box, which is exactly right for a generic speaker.  No `adc_pins`:
# it is a passive peripheral, not an MCU.

speaker:
  description: Small 4-8 ohm passive speaker — the DY-SV5F's direct audio output.

  # Canonical pin map — the netlist (hookup.wires) speaks EXACTLY these names.
  # Matches the DY-SV5F's Spk+/Spk- polarity so the wire reads plainly.
  pins:
    - "+"
    - "-"

  value: "8ohm"

  # Future KiCad interpreter target (documented; not built).
  kicad:
    symbol: "Device:Speaker"
    footprint: "Buzzer_Beeper:Speaker_Loudspeaker"
