<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  4-channel bidirectional logic level converter (BSS138 cell x4) — breadboard
  footprint.  The SparkFun BOB-12009 / Adafruit #757 / generic clone layout.

  HAND-AUTHORED 2026-08-15 in the Fritzing breadboard convention (physical
  width in inches + connectorNpin circles), NOT a community .fzpz import.
  Geometry: 0.60 x 0.55 in board, two 6-pin 0.1" rows.  viewBox is 1000
  units/inch, so the 0.1" pitch = 100 u.

  Topology per channel (Philips AN97055, the canonical open-drain translator):
  an N-channel BSS138 with GATE tied to LV, SOURCE to the low side, DRAIN to
  the high side, and a 10 kOhm pull-up on EACH side.  It is bidirectional and
  OPEN-DRAIN in both directions, which is why it can pass the TM1637's ACK — a
  push-pull direction-pin translator cannot.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.2"
     id="bss138-4ch-levelshift"
     x="0in" y="0in"
     width="0.6in"
     height="0.55in"
     viewBox="0 0 600 550">

  <rect id="pcb" x="0" y="0" width="600" height="550" rx="16" ry="16"
        fill="#7A1B1B" stroke="#4E1010" stroke-width="6"/>

  <!-- the four BSS138 cells (silkscreen) -->
  <g id="cells" opacity="0.9">
    <rect x="90"  y="215" width="90" height="120" rx="8" fill="#1A1D22"/>
    <rect x="205" y="215" width="90" height="120" rx="8" fill="#1A1D22"/>
    <rect x="320" y="215" width="90" height="120" rx="8" fill="#1A1D22"/>
    <rect x="435" y="215" width="90" height="120" rx="8" fill="#1A1D22"/>
  </g>
  <text x="300" y="290" font-family="monospace" font-size="34" fill="#F0D9D9"
        text-anchor="middle">BSS138 x4</text>

  <!-- ===== LOW-VOLTAGE row (top) — to the 3.3 V host ===== -->
  <rect x="10" y="20" width="80" height="80" rx="6"
        fill="none" stroke="#F4E2E2" stroke-width="6"/>
  <g id="rowLV">
    <circle id="connector0pin"  cx="50"  cy="60" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector1pin"  cx="150" cy="60" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector2pin"  cx="250" cy="60" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector3pin"  cx="350" cy="60" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector4pin"  cx="450" cy="60" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector5pin"  cx="550" cy="60" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle cx="50"  cy="60" r="12" fill="#7A1B1B"/>
    <circle cx="150" cy="60" r="12" fill="#7A1B1B"/>
    <circle cx="250" cy="60" r="12" fill="#7A1B1B"/>
    <circle cx="350" cy="60" r="12" fill="#7A1B1B"/>
    <circle cx="450" cy="60" r="12" fill="#7A1B1B"/>
    <circle cx="550" cy="60" r="12" fill="#7A1B1B"/>
    <text x="50"  y="128" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">LV</text>
    <text x="150" y="128" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">LV1</text>
    <text x="250" y="128" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">LV2</text>
    <text x="350" y="128" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">LV3</text>
    <text x="450" y="128" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">LV4</text>
    <text x="550" y="128" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">GND</text>
  </g>
  <text x="300" y="180" font-family="monospace" font-size="28" fill="#E9B9B9"
        text-anchor="middle">LV SIDE — 3.3 V</text>

  <!-- ===== HIGH-VOLTAGE row (bottom) — to the 5 V modules ===== -->
  <text x="300" y="392" font-family="monospace" font-size="28" fill="#E9B9B9"
        text-anchor="middle">HV SIDE — 5 V</text>
  <g id="rowHV">
    <text x="50"  y="440" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">HV</text>
    <text x="150" y="440" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">HV1</text>
    <text x="250" y="440" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">HV2</text>
    <text x="350" y="440" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">HV3</text>
    <text x="450" y="440" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">HV4</text>
    <text x="550" y="440" font-family="monospace" font-size="30" fill="#F4E2E2" text-anchor="middle">GND</text>
    <circle id="connector6pin"  cx="50"  cy="490" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector7pin"  cx="150" cy="490" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector8pin"  cx="250" cy="490" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector9pin"  cx="350" cy="490" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector10pin" cx="450" cy="490" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle id="connector11pin" cx="550" cy="490" r="30" fill="#C9A227" stroke="#8C6D12" stroke-width="6"/>
    <circle cx="50"  cy="490" r="12" fill="#7A1B1B"/>
    <circle cx="150" cy="490" r="12" fill="#7A1B1B"/>
    <circle cx="250" cy="490" r="12" fill="#7A1B1B"/>
    <circle cx="350" cy="490" r="12" fill="#7A1B1B"/>
    <circle cx="450" cy="490" r="12" fill="#7A1B1B"/>
    <circle cx="550" cy="490" r="12" fill="#7A1B1B"/>
  </g>
</svg>
