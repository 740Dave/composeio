<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  TM1637 4-digit 7-segment LED display MODULE — breadboard footprint.

  HAND-AUTHORED 2026-08-15 (not a Fritzing import), in the Fritzing breadboard
  convention the compositing pass requires (render/engine/parts/footprint.py):
    * the root declares a PHYSICAL width/height in inches — that is what fixes
      the board-grid scale (0.1" == PITCH).  Without it the part silently falls
      back to generated art.
    * every catalog pin resolves to a `connectorNpin` circle, whose
      transform-resolved center IS the coordinate wires lock to.

  Geometry: 42.0 x 24.0 mm board == 1.6535 x 0.9449 in.  viewBox is 1000
  units/inch (the same scale as the other cached assets), so 1 mm = 39.3701 u
  and the 2.54 mm header pitch = 100 u.

  ⛔ THE SEGMENTS ARE DRAWN UNLIT, DELIBERATELY.  Lighting a glyph here would
  assert a SEGMENT MAP that [CXC-TM1637-SEGMENT-MAP-UNVERIFIED] records as
  unverified — the die exposes SEG1..SEG8 and which physical bar each drives is
  a decision of THIS module's traces, which nobody has looked at.  A footprint
  that draws "12:34" would be a confident, well-formed, unchecked claim in the
  one artifact a builder trusts most.  All eight segments of all four digits are
  drawn in the same dim red; the art asserts only that there are four digits, a
  colon, and where the pads are.

  ⚠ BOARD-CONFIRM, both flagged in tm1637-4digit.yaml:
    (1) the HEADER PIN ORDER (CLK, DIO, VCC, GND top->bottom) is the common
        silkscreen and it VARIES BY CLONE — several ship GND, VCC, DIO, CLK.
    (2) the two headers are wired PIN-FOR-PIN IN PARALLEL (all four nets bussed
        along the board).  They are a wiring convenience, NOT a chain — see
        [CXC-TM1637-NO-CHAIN].  Butting two modules together on them commons
        DIO as well as CLK, which is the mirrored-display topology, not the
        independent-display one.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.2"
     id="tm1637-4digit"
     x="0in" y="0in"
     width="1.6535433in"
     height="0.9448819in"
     viewBox="0 0 1653.5433 944.88189">

  <!-- ================= PCB ================= -->
  <g id="board">
    <rect id="pcb" x="0" y="0" width="1653.5433" height="944.88189"
          rx="24" ry="24" fill="#12481F" stroke="#0B2F14" stroke-width="8"/>
    <!-- mounting holes (2.8 mm), corners -->
    <circle cx="80" cy="80" r="55" fill="#0B2F14"/>
    <circle cx="80" cy="80" r="40" fill="#8D9AA6"/>
    <circle cx="1573.5433" cy="864.88189" r="55" fill="#0B2F14"/>
    <circle cx="1573.5433" cy="864.88189" r="40" fill="#8D9AA6"/>
  </g>

  <!-- ================= display window ================= -->
  <g id="window">
    <rect x="250" y="235" width="1000" height="470" rx="16" ry="16"
          fill="#140406" stroke="#2A0C10" stroke-width="6"/>

    <!-- digit 0 -->
    <g id="d0" transform="translate(300 320)">
      <rect x="20"  y="0"   width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="130" y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="130" y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="260" width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="0"   y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="0"   y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="130" width="110" height="20"  rx="9" fill="#4A1418"/>
    </g>
    <!-- digit 1 -->
    <g id="d1" transform="translate(490 320)">
      <rect x="20"  y="0"   width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="130" y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="130" y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="260" width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="0"   y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="0"   y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="130" width="110" height="20"  rx="9" fill="#4A1418"/>
    </g>
    <!-- colon (ONE bit on the clock variant; see the yaml's colon note) -->
    <g id="colon">
      <circle cx="700" cy="400" r="15" fill="#4A1418"/>
      <circle cx="700" cy="540" r="15" fill="#4A1418"/>
    </g>
    <!-- digit 2 -->
    <g id="d2" transform="translate(770 320)">
      <rect x="20"  y="0"   width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="130" y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="130" y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="260" width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="0"   y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="0"   y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="130" width="110" height="20"  rx="9" fill="#4A1418"/>
    </g>
    <!-- digit 3 -->
    <g id="d3" transform="translate(960 320)">
      <rect x="20"  y="0"   width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="130" y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="130" y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="260" width="110" height="20"  rx="9" fill="#4A1418"/>
      <rect x="0"   y="150" width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="0"   y="20"  width="20"  height="110" rx="9" fill="#4A1418"/>
      <rect x="20"  y="130" width="110" height="20"  rx="9" fill="#4A1418"/>
    </g>
  </g>

  <!-- ================= TM1637 die (SOP20 silkscreen) ================= -->
  <g id="chip">
    <rect x="1300" y="330" width="150" height="280" rx="10"
          fill="#15181C" stroke="#0A0C0E" stroke-width="5"/>
    <circle cx="1330" cy="360" r="14" fill="#3A4048"/>
    <text x="1375" y="490" font-family="monospace" font-size="46" fill="#9FB0A6"
          text-anchor="middle" transform="rotate(-90 1375 490)">TM1637</text>
  </g>

  <!-- ================= header A (left edge) ================= -->
  <!-- pin 1 square pad marker -->
  <rect x="60" y="282.44" width="80" height="80" rx="6"
        fill="none" stroke="#D8E4C8" stroke-width="7"/>
  <g id="headerA">
    <circle id="connector0pin" cx="100" cy="322.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle id="connector1pin" cx="100" cy="422.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle id="connector2pin" cx="100" cy="522.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle id="connector3pin" cx="100" cy="622.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle cx="100" cy="322.44" r="14" fill="#12481F"/>
    <circle cx="100" cy="422.44" r="14" fill="#12481F"/>
    <circle cx="100" cy="522.44" r="14" fill="#12481F"/>
    <circle cx="100" cy="622.44" r="14" fill="#12481F"/>
    <text x="152" y="336" font-family="monospace" font-size="44" fill="#E4EFD9">CLK</text>
    <text x="152" y="436" font-family="monospace" font-size="44" fill="#E4EFD9">DIO</text>
    <text x="152" y="536" font-family="monospace" font-size="44" fill="#E4EFD9">VCC</text>
    <text x="152" y="636" font-family="monospace" font-size="44" fill="#E4EFD9">GND</text>
  </g>

  <!-- ================= header B (right edge, SAME NETS) ================= -->
  <g id="headerB">
    <circle id="connector4pin" cx="1553.5433" cy="322.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle id="connector5pin" cx="1553.5433" cy="422.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle id="connector6pin" cx="1553.5433" cy="522.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle id="connector7pin" cx="1553.5433" cy="622.44" r="34" fill="#C9A227" stroke="#8C6D12" stroke-width="7"/>
    <circle cx="1553.5433" cy="322.44" r="14" fill="#12481F"/>
    <circle cx="1553.5433" cy="422.44" r="14" fill="#12481F"/>
    <circle cx="1553.5433" cy="522.44" r="14" fill="#12481F"/>
    <circle cx="1553.5433" cy="622.44" r="14" fill="#12481F"/>
    <text x="1501" y="336" font-family="monospace" font-size="44" fill="#E4EFD9" text-anchor="end">CLK</text>
    <text x="1501" y="436" font-family="monospace" font-size="44" fill="#E4EFD9" text-anchor="end">DIO</text>
    <text x="1501" y="536" font-family="monospace" font-size="44" fill="#E4EFD9" text-anchor="end">VCC</text>
    <text x="1501" y="636" font-family="monospace" font-size="44" fill="#E4EFD9" text-anchor="end">GND</text>
  </g>

  <!-- bussed-nets silkscreen: the two headers are IN PARALLEL, not a chain -->
  <g id="bus-hint" opacity="0.55">
    <line x1="140" y1="322.44" x2="1513" y2="322.44" stroke="#6FA97F" stroke-width="5" stroke-dasharray="26 22"/>
    <line x1="140" y1="422.44" x2="1513" y2="422.44" stroke="#6FA97F" stroke-width="5" stroke-dasharray="26 22"/>
    <line x1="140" y1="522.44" x2="1513" y2="522.44" stroke="#6FA97F" stroke-width="5" stroke-dasharray="26 22"/>
    <line x1="140" y1="622.44" x2="1513" y2="622.44" stroke="#6FA97F" stroke-width="5" stroke-dasharray="26 22"/>
  </g>

  <!-- ================= silkscreen ================= -->
  <text x="826" y="128" font-family="monospace" font-size="62" fill="#E4EFD9"
        text-anchor="middle">TM1637 · 4-DIGIT</text>
  <text x="826" y="828" font-family="monospace" font-size="46" fill="#A9C4B0"
        text-anchor="middle">VDD 5V — headers A/B are the SAME four nets</text>
</svg>
