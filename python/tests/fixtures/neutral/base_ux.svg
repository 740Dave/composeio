<?xml version="1.0" encoding="UTF-8"?>
<!-- Neutral test fixture: a generic device-control base layout with composition slots.
     Two buttons with DIFFERENT shapes (rect, path) bind the same widget kind. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="338.66667mm" height="254mm" viewBox="0 0 338.66667 254">
  <g inkscape:groupmode="layer" id="layer-bg" inkscape:label="background">
    <rect id="bg" x="0" y="0" width="338.66667" height="254" style="fill:#000000" inkscape:label="bg-rect"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-std" inkscape:label="standard-ux-layout">
    <path id="screen" d="M 10 10 L 328 10 L 328 244 L 10 244 Z" style="fill:#111111" inkscape:label="screen-area"/>
    <rect id="slot-mode" x="20" y="40" width="120" height="60" style="fill:none;stroke:#888888" inkscape:label="slot:radio@mode"/>
    <rect id="slot-fw" x="20" y="200" width="200" height="20" style="fill:none;stroke:#888888" inkscape:label="slot:text@firmware"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-buttons" inkscape:label="row1-button-bar">
    <g id="btn-reboot" inkscape:label="slot:button@reboot">
      <rect id="btn-reboot-shape" x="200" y="20" width="50" height="16" rx="2" style="fill:#444444" inkscape:label="button-shape"/>
      <text id="btn-reboot-text" x="205" y="31" style="font-size:8px;fill:#ffffff" inkscape:label="button-text-label"><tspan id="btn-reboot-ts" x="205" y="31">REBOOT</tspan></text>
    </g>
    <g id="btn-shutdown" inkscape:label="slot:button@shut-down">
      <path id="btn-shutdown-shape" d="M 260 20 L 316 20 L 320 28 L 316 36 L 260 36 Z" style="fill:#444444" inkscape:label="button-shape"/>
      <text id="btn-shutdown-text" x="265" y="31" style="font-size:8px;fill:#ffffff" inkscape:label="button-text-label"><tspan id="btn-shutdown-ts" x="265" y="31">SHUT DOWN</tspan></text>
    </g>
  </g>
</svg>
