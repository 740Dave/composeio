<?xml version="1.0" encoding="UTF-8"?>
<!-- Neutral test fixture: four theme-swatch groups directly under a layer (no wrapper group). -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="120mm" height="40mm" viewBox="0 0 120 40">
  <g inkscape:label="Layer 1" inkscape:groupmode="layer" id="layer1">
    <g inkscape:label="light" id="g-light">
      <rect inkscape:label="base" id="light-base" x="0" y="0" width="10" height="10" style="display:inline;fill:#d9d9d9;stroke:none"/>
      <rect inkscape:label="highlight" id="light-hl" x="12" y="0" width="10" height="10" style="display:inline;fill:#ffffff;stroke:none"/>
    </g>
    <g inkscape:label="dark" id="g-dark">
      <rect inkscape:label="base" id="dark-base" x="30" y="0" width="10" height="10" style="display:inline;fill:#202020;stroke:none"/>
      <rect inkscape:label="highlight" id="dark-hl" x="42" y="0" width="10" height="10" style="display:inline;fill:#5a5a5a;stroke:none"/>
    </g>
    <g inkscape:label="warm" id="g-warm">
      <rect inkscape:label="base" id="warm-base" x="60" y="0" width="10" height="10" fill="#8a4b10"/>
      <rect inkscape:label="highlight" id="warm-hl" x="72" y="0" width="10" height="10" fill="#e0a050"/>
    </g>
    <g inkscape:label="cool" id="g-cool">
      <rect inkscape:label="base" id="cool-base" x="90" y="0" width="10" height="10" style="fill:#1f4e79"/>
      <rect inkscape:label="highlight" id="cool-hl" x="102" y="0" width="10" height="10" style="fill:#6fa8dc"/>
    </g>
  </g>
</svg>
