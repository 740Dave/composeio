[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composeio"
version = "0.1.0"
description = "Software-Defined I/O for Hardware Projects"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6.0"]
audio = ["miniaudio>=1.60"]
nfc = ["smbus2>=0.4.0"]
media = ["av>=10.0"]
dev = ["pytest>=7.0", "pytest-cov"]
all = ["paho-mqtt>=1.6.0", "miniaudio>=1.60", "smbus2>=0.4.0", "av>=10.0", "pytest>=7.0", "pytest-cov"]

[project.scripts]
composeio = "composeio.cli:main"

[tool.pytest.ini_options]
testpaths = ["../tests"]
