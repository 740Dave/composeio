# ComposeUX Intelligence Console — WORK flavor, Skia scene.
#
# VISUAL-FIDELITY pass ([SPEC:CXC-CONSOLE-VISUAL]): the approved "blended" pre-vis
# (docs/intelligence-console/previs/console-blended.html) rendered on the REAL Skia backend —
# collaboration's chat-forward LAYOUT wearing instrument's dark azure PALETTE.  Design tokens
# live in python/composeio/render/widgets/console_theme.py ([CXC-ICV-TOKENS]); theme is a token
# swap ([CXC-ICV-THEME]); motion is scene-graph animation gated by design.reduced_motion
# ([CXC-ICV-MOTION]).
#
# THE FROZEN SEAM ([CXC-ICV-INTENT]): every widget's on_bus_state, its subscribed namespaces,
# and the bindings below are the PROVEN functional MVP wiring — the fidelity pass ADDED
# namespaces/widgets and restyled draw(), it never rewrote an existing binding.
#
# Render (headless PNG):  python3 -m composeio.render.engine.runtime compose_projects/intelligence/console/console.compose.yaml --headless /tmp/console.png
# Run live (SDL2 window): python3 -m composeio.render.engine.runtime compose_projects/intelligence/console/console.compose.yaml --transports

app:
  id: intelligence-console
  # Declared but only connected with the --transports flag (headless PNG ignores it and uses the
  # `initial:` seeds). With --transports the gauge + thread bind LIVE from the ComposeBus.
  transports:
    - type: mqtt
      # no broker: here: the host's COMPOSEIO_MQTT_BROKER governs ([DP-CIO-6], [CXC-SCL-SCRUB-OVERLAY-PARITY])
      port: 1883

design:
  target: desktop
  title: "Intelligence Console — architect"
  # [CXC-IC-SELF-IDENTITY] [DEC-INPROCESS-SOURCES] THIS scene is the declared HOST
  # of the console's in-process data layer: with --transports the runtime also
  # brings up the session-owned publishers (self_publisher, transcript_publisher,
  # the monitors + launchers) as daemon threads pinned to THIS console's session.
  # The opt-in is DECLARATIVE + fail-safe — a scene that omits this flag (e.g. the
  # Launch Bar ribbon, a pure tile scene running under the same architect id with
  # --transports) NEVER co-hosts the data layer and so can never win the per-role
  # singleton flocks away from this console.
  data_sources: true
  theme: dark                 # dark|light|high-contrast — picks the console_theme token table at mount
  reduced_motion: false       # [CXC-ICV-MOTION] true -> every loop renders its REST frame
  # [SPEC:CXC-CONSOLE-PROD] surfaces 1-3 (render-deep personalization):
  #  * personalization: <id> -> at launch the runtime reads Foundation A
  #    (compose_projects/intelligence/meta/<id>.meta.json :: console) and applies the persisted
  #    window / font_scale / theme / theme_custom (personalization.py, loaded by
  #    file path).  Empty on any other scene -> unchanged.
  #  * resizable + persist_geometry + min_width/height + window_key ->
  #    [CXC-ICP-S1-RESIZE]: the window resizes and the layout REFLOWS; the drag
  #    geometry persists per-instance via the geometry seam and restores at
  #    launch (a dragged size wins over the Foundation-A default).
  personalization: architect
  resizable: true
  persist_geometry: true
  min_width: 960
  min_height: 720
  window_key: intelligence-console
  width: 1280
  # 1300 -> 1620: the rail gained the 300px Deliverables card (+13 gap); the
  # canvas grows so no rail card clips.  (Chrome only — no binding touched.)
  # 1620 -> 1656: the console-level [Collaboration | Artifacts] tab bar
  # (44px) + the previs 12px below-bar gap.  (Chrome only.)
  # 1656 -> 1740 ([DEC-INTELLIGENCE-WIDGET-CONSOLIDATION]): the header grew
  # 52->104 to seat the larger avatar, pushing the frozen thread+composer down
  # 52px; the surface grows so the composer stays on-canvas (else its damage
  # rect clamps off the bottom and every keystroke forces a full redraw).
  height: 1740
  # [CXC-ICV-CHROME] scene background pass: the #070a0f ground + the faint 40px cockpit grid
  # + a single soft azure radial wash top-right (presence, not alarm).
  background: [0x07, 0x0A, 0x0F]
  background_grid: {color: [120, 150, 190, 9], size: 40}
  background_wash: {color: [78, 168, 255, 33], cx: 0.84, cy: -0.10, r: 0.9}

# ══ THE DECLARED INSTANCE LIST — THE ONE PLACE THAT NAMES THIS CONSOLE'S FLEET ══
# [CXC-FC-UNIT] / [CXC-FC-VAR-SCOPE] (2026-08-12).  An Intelligence in this console is
# declared by an `(id, role)` PAIR and nothing else.  Every bus topic, every daemon
# argument, every identity home and every config path DERIVES from that pair.
#
# THE PAIR, NOT A SCALAR.  `role` is not derivable from `id`:
# `ptycore.resolve_meta_manifest(id, role)` takes role as a PARAMETER because chain leg 2
# (`compose_projects/intelligence/meta/<id>.meta.json`) MISSES for every child that is not hand-curated —
# measured, `architect-hosted` has no per-id manifest.  Deriving role from a naming
# convention on the id is FORBIDDEN ([CXC-FC-THREE-AXES]): it works until the first id
# that does not follow the convention, and it produces a WRONG project dir (hence a
# wrong MEMORY STORE, [CXC-FC-PROJECT-DIR]) rather than a refusal.
#
# WHAT THIS REPLACES.  This block used to be `variables: {chat_id: architect-hosted}`
# ([DEC-CONSOLE-CHAT-ID-PARAM], 2026-08-11) — one Intelligence, spelled once — and
# `start-console-daemons.sh` shelled out to `data_sources.scene_chat_id()` to read THE
# SAME LINE out of THE SAME FILE.  The list is the single source now; `$chat_id` is
# DERIVED from entry 0 by the parser (`render/engine/instances.py`), so every existing
# `$chat_id` site below still resolves and there is nowhere to write a second value.
#
# EVERY channel site derives from entry 0's id (via the derived `$chat_id`):
#   1. the `compose_projects/intelligence/$chat_id/{out,in,compose,channel/alive}` DECLARATIONS below,
#   2. the `chat_thread` widget's `namespaces:` (out + in),
#   3. the `composer_field` `namespace:` (compose) and the `link_health` `namespace:`,
#   4. N in-process `channel_bridge`s — ONE PER DECLARED INSTANCE ([CXC-FC-S1-BRIDGES]).
#      The bridge's flock is keyed `channel-bridge-<id>`, so distinct ids provably
#      cannot contend; the mechanism was always right, it was simply never instantiated
#      more than once.
#
# ⚠ WHAT DOES **NOT** DERIVE FROM IT — DELIBERATELY.  `self/architect/*` and
# `thread/architect/narration` are TELEMETRY produced by this console's OWN
# transcript-tailing sources (self_publisher, transcript_publisher), pinned to the
# HOST's session via `--id <intelligence_id>`.  Repointing them at the child would make
# the console CLAIM the child's context gauge while tailing the HOST's transcript — the
# exact mismatch class [CXC-IH-5A] closed.  Two roles, two ids, on purpose:
#   intelligence_id (host, telemetry)  vs  the declared instance (who we talk to).
instances:
  - {id: architect-hosted, role: composeux-architect}
  - {id: architect,        role: composeux-architect}

# ══ THE PANE, IMPORTED BY REFERENCE ([CXC-FC-COMPOSITE]) ══════════════════════
# ONE definition of `intelligence_pane`, reachable from two scenes.  Copying it into
# this file instead would be the fork [SPEC:CXC-FLEET] exists to prevent, and it is the
# reason `components_from:` was built: without it, FC-C1/FC-C12/FC-C13 were provable
# only against the component library's own demo surface, so the console David actually
# launches could not satisfy its own MANDATORY glass legs.
#
# ⚠ NOTE WHAT THE TWO DECLARED INSTANCES SHARE.  `architect` and `architect-hosted` are
# two INSTANCES OF ONE ROLE, so they share ONE memory store at
# `~/compose-instances/composeux-architect/memory/` — BY DESIGN ([DD-FC-MEMORY-GRAIN]),
# not by accident.  Distinct channel topics, distinct telemetry, distinct voices; one
# store.  That is [CXC-FC-THREE-AXES] working: axis 1 (ROLE) shared, axis 2 (INSTANCE
# ID) distinct, axis 3 (HOST) carrying no identity at all.
components_from:
  - ../../../python/composeio/render/examples/components/intelligence_pane.compose.yaml

# ══ THE PER-INSTANCE TOPIC SET — STAMPED, NOT REPEATED ════════════════════════
# One template, stamped once per entry in `instances:` above.  Written out per id, this
# would be five near-identical lines times N, sitting two hundred lines away from the
# list that governs them — and adding an Intelligence would stop being ONE edit.  That
# is the same fork class as two sources for one binding, and it fails later and less
# visibly: as a topic nobody DECLARED rather than a topic nobody publishes.
#
# `scope: global` on `/compose` PINS it to the MQTT leg (DP-CIO-5): the auto
# has-local-subscribers heuristic would otherwise downgrade it to an in-process send the
# bridge never sees, and David's message would die LOOKING SENT.
#
# `/channel/alive` is the liveness HEARTBEAT — channel.mjs beats every ~5s and that
# instance's bridge relays it onto the composeio scheme.  A heartbeat that stops arriving
# means the channel MCP is down while the bus may still be up: the silent-send failure
# where a message echoes to the thread and never reaches the Intelligence.  Each pane
# watches ITS OWN, so one Intelligence going dark cannot make the other look dark too.
#
# ⚠ `self/<id>/*` and `thread/<id>/narration` are NOT here.  They are HOST telemetry,
# published by this console's transcript-tailing sources pinned to the host's session,
# and they do not follow a chat declaration ([CXC-IH-5A]).  Two ids, two roles.
instance_namespaces:
  - {name: "intelligence/{{instance_id}}/out", state_engine: json, export: true, label: "Replies · {{instance_id}}"}
  - {name: "intelligence/{{instance_id}}/in", state_engine: json, export: true, label: "Inbound · {{instance_id}}"}
  - {name: "intelligence/{{instance_id}}/compose", state_engine: json, export: true, scope: global, label: "Composer · {{instance_id}}"}
  - {name: "intelligence/{{instance_id}}/channel/alive", state_engine: json, export: true, label: "Heartbeat · {{instance_id}}"}
  - {name: "thread/{{instance_id}}/narration", state_engine: json, export: true, label: "Narration · {{instance_id}}"}
  - {name: "_app/{{instance_id}}/pane_mode", state_engine: json, export: true, scope: local, initial: "engage", label: "Pane mode · {{instance_id}}"}
  - {name: "_app/{{instance_id}}/link_state", state_engine: json, export: true, scope: local, label: "Link state · {{instance_id}}"}

# The semantic namespaces the console binds — ALL already live on the bus (self_sensor, harness
# monitor, transcript publisher). `initial:` seeds one message per topic for the static PNG.
#
# [CXC-IH-5A] carried-identity HARD SWITCH (this IS the architect console): every PER-INSTANCE
# reading is bound under `self/architect/*` / `thread/architect/*` — the id-scoped topics the
# publishers now emit with --namespace-by-id (self_publisher + transcript_publisher). This stops
# the shared-broker MERGE: a second intelligence (e.g. provisionio) publishing bare/`self/<its-id>/*`
# can no longer clobber this console. A future fleet view subscribes `self/+/*` / `thread/+/*`.
# INTENT/CONFIG channels stay BARE/global (self/model/select, self/account/signin, self/meta, the
# intelligence/architect/* channels) — a widget must reach the intelligence at a stable topic.
# self/deliverables, self/meta, self/away_watches, self/projects are OTHER daemons' projections,
# left bare here and FLAGGED as follow-on cross-instance vectors ([CXC-IH-5A] migration).
namespaces:
  - name: self/architect/context_pct
    state_engine: json
    export: true
    label: "Context %"
    # additive dict seed ([CXC-ICV-GAUGE]): {pct, tokens, max_tokens, source}; a bare float
    # publish still drives the gauge exactly as before.
    initial: {pct: 45.0, tokens: 450000, max_tokens: 1000000, source: "stdin · used_percentage"}
  - {name: self/architect/context_level, state_engine: json, export: true, label: "Context"}
  - name: self/architect/registered
    state_engine: json
    export: true
    label: "Registered"
    initial:
      items:
        - {name: composeux-architect.md, path: .claude/agents/, ok: true}
        - {name: registration-protocol.md, path: bootstrap/dusk-gifts/, ok: true}
        - {name: README.md, path: bootstrap/dusk-gifts/, ok: true}
        - {name: relational-registration.md, path: bootstrap/dusk-gifts/, ok: true}
  - name: self/architect/activity
    state_engine: json
    export: true
    label: "Activity"
    initial: {tool: Edit, target: launcher.py, phase: start, id: seed-1}
  - name: self/architect/subagents
    state_engine: json
    export: true
    label: "Subagents"
    # status MUST NOT be a live "dispatched"/running here: a running seed has no
    # matching 'done' event, so it wedged as a permanent phantom running chip
    # that never pruned (the pile-up bug).  A `done` seed is styled resolved and
    # is swept by the linger prune in a live session ([CXC-ICV-SUBAGENTS]).
    initial: {type: general-purpose, model: opus, desc: "Blended target", status: done, dur_s: 288, tokens: 72000, id: seed-sa1}
  - name: thread/architect/narration
    state_engine: json
    export: true
    label: "Narration"
  # ── THE CHAT/CHANNEL SURFACES — ONE SET PER DECLARED INSTANCE ([CXC-FC-UNIT]).
  # Written out per id rather than derived from a single `$chat_id`, because there is
  # no longer a single one: two panes, two complete and DISJOINT sets.  Every
  # `self/architect/*` and `thread/architect/*` topic around them stays on the HOST id
  # by design ([CXC-IH-5A]) — those are the console's own transcript-tailing feeds.
  #
  # `scope: global` on each `/compose` PINS it to the MQTT leg (DP-CIO-5): the auto
  # has-local-subscribers heuristic would otherwise downgrade it to an in-process send
  # the bridge never sees, and David's message would die LOOKING SENT.
  #
  # `/channel/alive` is the liveness HEARTBEAT — channel.mjs beats every ~5s and the
  # bridge relays it onto the composeio scheme.  A heartbeat that stops arriving means
  # the channel MCP is down while the bus may still be up: the silent-send failure
  # where a message echoes to the thread and never reaches the Intelligence.  Each
  # pane watches ITS OWN, so one Intelligence going dark cannot make the other look
  # dark too.
  # (the per-instance sets are STAMPED from `instance_namespaces:` below — see the note
  # there for why they are not written out one block per id)
  # ── the ONE roster ([CXC-FC-S3-ROSTER]) — one computation, one topic, N readers ──
  # Declared LITERALLY and deliberately: the roster is console-self and must NOT multiply
  # by instance ([CXC-FC-SPLIT-RULE] — could its correct value differ between two
  # Intelligences?  No: it is the list OF them).
  - {name: fleet/roster, state_engine: json, export: true, label: "Fleet roster"}
  # render-side health VERDICT the live-dot publishes; the header link label +
  # the composer SEND button bind to it.  LOCAL scope: never leaves the console.
  - {name: console/link/state, state_engine: json, export: true, scope: local, label: "Link state"}
  # ── fidelity-pass ADDED namespaces ──
  - name: self/architect/avatar/expression
    state_engine: json
    export: true
    label: "Avatar expression"
    initial: focused
  # [DEC-CANVAS-TAB-RETIRED, David 2026-07-24] the thread/architect/diagram
  # binding was REMOVED with the Canvas tab + canvas_panel widget: its only
  # consumer (the mermaid canvas) is retired, its role now covered by the
  # doc-viewer.  The PUBLISHER (transcript_publisher.py, thread/diagram ->
  # thread/architect/diagram) is left intact — flagged for the architect.
  - name: self/architect/rate_limit
    state_engine: json
    export: true
    label: "Rate limit"
    initial: {"5h": {pct: 38, resets: "14:22"}, "7d": {pct: 12}}
  - name: self/architect/compactions
    state_engine: json
    export: true
    label: "Compactions"
    initial: {count: 3, ids: [c9, c10, c11]}
  - name: self/architect/output_tokens
    state_engine: json
    export: true
    label: "Output tokens"
    # [DEC-INTELLIGENCE-WIDGET-CONSOLIDATION] seed so the static render shows
    # the Usage row ("2.381M tokens out"); a live publish overrides it.
    initial: 2381000
  - name: self/architect/memory   # [DEC-MEMORY-BLOAT-MONITOR] automemory footprint -> Intelligence-card gauge
    state_engine: json
  - name: self/architect/effort
    state_engine: json
    export: true
    label: "Effort"
    initial: {level: high}
  # ── [DEC-INTELLIGENCE-WIDGET-CONSOLIDATION] consolidation namespaces ──
  # NEW published-by-the-widgets intents (the launcher/actuation wiring is the
  # architect's follow-on; the widgets publish and STOP):
  - {name: self/model/select, state_engine: json, export: true, scope: global, label: "Model select (intent)"}
  - {name: self/account/signin, state_engine: json, export: true, scope: global, label: "Account sign-in (intent)"}
  # LOCAL open/close seam for the model/effort picker modal (the Intelligence
  # card's Change chip publishes it; the picker subscribes it).
  - {name: _app/model_picker, state_engine: json, export: true, scope: local, label: "Model picker open"}
  # ── deliverables (LOCKED compact card, [DEC-DELIVERABLE-HISTORY-WIDGET]) ──
  # Published by compose_projects/intelligence/publisher/deliverable_publisher.py over MQTT
  # (composeio/global/self/deliverables); scope: global pins the topic to the
  # MQTT leg (DP-CIO-5) so the local card subscription can never downgrade it.
  # The `initial:` seed is the FULL REAL ledger projection (publisher --once,
  # 2026-07-21: stats + recent + the 41-row `all` the Artifacts view renders)
  # with two rows stamped seen so the static render proves BOTH row looks
  # (bold unseen / plain seen).
  - name: self/deliverables
    state_engine: json
    export: true
    scope: global
    label: "Deliverables"
    initial:
      stats:
        needs_enrich: 1
        new_session: 41
        tracked: 41
      recent:
